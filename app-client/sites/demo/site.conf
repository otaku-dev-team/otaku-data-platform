# 换肤演示件（#367）—— 只用于自证「同内核 → 不同品牌壳是配置级」。
#
# ⚠️ 边界（issue #367 红线 / docs/positioning.md G3）：
#   - 这不是第二个运营站，也不是真实多站客户；只是机制演示件。
#   - 运行期「一个 App 里选站点」禁止；站点只在构建期烘焙，每站独立构建分发。
#   - 对外措辞：换肤 demo = 机制已演示；跨域 / 多站交付 = 理论中。
#
# 与首站的差异**只有品牌项**（APP_NAME / BRAND_COMPANY / APP_ID）。
# 内核、后端、数据域必须完全一致，否则就不是「换壳」而是「接了另一套系统」。

# 站点键。**故意与首站相同**：它与后端 `site.site_key` 同值，决定数据隔离域。
# 演示件连同一套后端与同一份数据，换掉它只会让请求查不到数据，
# 而且会把「换品牌壳」误做成「接第二站」——那正是红线要排除的。
SITE_ID="otaku_site"

# 应用名。桌面窗口标题、关于页、Android Launcher 名、BrandMark 首字徽标都取它。
# 换成不同首字母，徽标当场从「O」变成「D」，是最直观的一处差异。
# 故意不带空格：品牌项要同时喂给 bash 的 --dart-define 与 Windows 的
# build_site.ps1，无空格的值在两条构建链上都不会有引号 / 分词歧义。
APP_NAME="DemoACGN"

# 品牌归属方（桌面版权行）。同上，不带空格。
BRAND_COMPANY="SkinDemoBuild"

# Android 包名。必须不同于首站：同机装两个包时，包名相同会被系统当成同一个
# 应用的升级，数据互相覆盖（见首站 site.conf 同条注释）。
APP_ID="com.otaku.demo"

# 后端 / 来源站：同源内核，沿用首站。
API_BASE_URL="http://154.8.194.198:8080"
SITE_BASE_URL="http://154.8.194.198:8000"

# OTA 基址故意留空：演示件不验证更新，也不该去拉首站分发的 latest.json。
# 真要出可分发包时，另配独立基址或关掉更新检查。
UPDATE_BASE_URL=""
