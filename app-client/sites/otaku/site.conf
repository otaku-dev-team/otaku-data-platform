# 站点交付配置 —— build_site.sh / build_site.ps1 读这一份。
#
# 格式：KEY="值"，一行一条，值用双引号包住（允许空格与中文）。
# 加第二站就复制整个目录：sites/<新站点键>/site.conf。
#
# 站名允许出现在 sites/{site}/ 下：scripts/check-site-isolation.py 只扫核心代码
# （backend-java/src/main/java、app-client/lib、sync-python/src），不扫这里。
# 这正是「站名只出现在适配包目录」的意思。

# 站点键。写进 AppConfig.siteId；设置页「品牌归属」与日志用它。
SITE_ID="otaku_site"

# 应用名。桌面窗口标题、关于页、Android Launcher 名（-PappName）。
APP_NAME="Otaku"

# 品牌归属方。桌面版权行用它。
BRAND_COMPANY="com.otaku"

# Android 包名（-PappId）。每站必须不同——同机装两个站时，
# 包名相同会被系统当成同一个应用的升级，数据互相覆盖。
APP_ID="com.otaku.app"

# 构建时连的后端。首站现在是「联调形态」：IP + HTTP，没有域名与证书。
# 上线时改成 https://<域名>；Android release 只认 HTTPS，所以那时才切。
API_BASE_URL="http://154.8.194.198:8080"

# 来源站地址（网站的 HTML 页面，不是平台 API）。
# App 内 WebView 用它打开 /oauth/authorize → /login → /register，走完注册直接登录。
# 留空 = 不显示站点登录入口（与不注入 `SITE_BASE_URL` 的默认行为一致）。
SITE_BASE_URL="http://154.8.194.198:8000"
