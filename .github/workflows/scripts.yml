name: scripts

# scripts/ 与 devkit/ 以前没有任何 CI：check-contract.py 与 check-site-isolation.py 有专属
# workflow，其余脚本（seed_mock_users / verify_related_ids / backfill_rating_count / devkit）
# 改了只能靠本机跑。结果就是 #431 那种「表名写错、静默跳过整批浏览数据」的 bug 只能靠人眼发现。
#
# 这里只做两件快事：全量 py_compile（挡住语法错误）+ devkit 的单元测试（挡住工具回归）。
# 不跑 flutter / maven / docker——那些有各自的 workflow，也不该让脚本改动的反馈变慢。

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "devkit/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "devkit/**"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查（scripts + devkit 全部 .py）
        run: python -m py_compile $(find scripts devkit -name '*.py')

      - name: devkit 单元测试
        run: |
          python -m pip install --quiet pytest
          python -m pytest devkit/tests -q
