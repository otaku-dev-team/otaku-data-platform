name: deploy-lint

# 为什么要有这个：`backend-java` 工作流只跑 mvn test，部署产物（compose / nginx /
# 运维脚本）此前**一次都没被验证过**——第一个发现配置写错的人会是在服务器上敲
# `up -d` 的那个人。
#
# 这不是理论风险：#199 加完 nginx 之后，`nginx -t` 从来没有跑过（开发机没有 nginx
# 二进制、Docker 引擎也没起）。而 GitHub runner 上有 Docker，能真跑：
#
#   1. compose 能不能解析（缺必填项会立刻失败，而不是在服务器上才发现）
#   2. 模板渲染后 nginx -t 过不过（指令名拼错、http2 与版本不匹配，都在这层抓）
#   3. 真起一个 nginx，验证 :80 的 /healthz 与「/ → 301 https」确实生效
#   4. 运维脚本语法（bash -n）
#
# 不验证：真实证书签发（需要域名）、备份是否真能 dump（需要 MySQL）、
# 多站产物（构建链还没有）。

on:
  push:
    branches: [main]
    paths:
      - "backend-java/nginx/**"
      - "backend-java/deploy/**"
      - "backend-java/compose.yaml"
      - "backend-java/compose.prod.yaml"
      - "backend-java/.env.production.example"
      - ".github/workflows/deploy-lint.yml"
  pull_request:
    paths:
      - "backend-java/nginx/**"
      - "backend-java/deploy/**"
      - "backend-java/compose.yaml"
      - "backend-java/compose.prod.yaml"
      - "backend-java/.env.production.example"
      - ".github/workflows/deploy-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # 用一个不会和真实域名冲突的名字；证书也只在这个名字下生成。
  CI_DOMAIN: example.test
  NGINX_IMAGE: nginx:1.27-alpine

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 构造一份「能解析」的 .env：只填必填项，值是明显的假值。
      # 目的是让 `compose config` 走到变量替换那一步，而不是停在缺值报错。
      # 注意：这里验证的是**结构**，不是安全（假口令不进任何真实环境）。
      - name: 准备 CI 用的 .env
        working-directory: backend-java
        run: |
          set -euo pipefail
          cp .env.production.example .env
          sed -i \
            -e "s|^DOMAIN=.*|DOMAIN=${CI_DOMAIN}|" \
            -e "s|^OTAKU_PUBLIC_BASE_URL=.*|OTAKU_PUBLIC_BASE_URL=https://${CI_DOMAIN}|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-not-a-real-password|" \
            -e "s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=ci-not-a-real-password|" \
            -e "s|^OTAKU_INTERNAL_TOKEN=.*|OTAKU_INTERNAL_TOKEN=ci-not-a-real-token|" \
            .env
          echo "--- 生效的必填项（值已打码）---"
          grep -E '^(DOMAIN|BACKEND_BIND|BACKEND_PORT)=' .env

      # 两个文件都要过：compose.yaml 是本地开发用的，compose.prod.yaml 是部署用的。
      # 后者更容易坏——它依赖 .env 里的必填项，少一个就整份起不来。
      - name: compose 能解析（开发 + 生产）
        working-directory: backend-java
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          echo "compose.yaml OK"
          docker compose -f compose.prod.yaml config --quiet
          echo "compose.prod.yaml OK"
          # certbot 在 tools profile 里：确认它存在且能被单独调起（deploy/*.sh 依赖这点）
          docker compose -f compose.prod.yaml --profile tools config --services | sort

      # 缺 DOMAIN 时必须**立刻失败**，而不是起一个 server_name 是空值的 nginx。
      # 这条是在验证「快速失败」本身，很容易在重构 env 示例时被弄丢。
      - name: 缺 DOMAIN 必须快速失败
        working-directory: backend-java
        run: |
          set -euo pipefail
          if DOMAIN= docker compose -f compose.prod.yaml config --quiet 2>/tmp/err.txt; then
            echo "::error::DOMAIN 为空时 compose 仍然解析成功——必填校验丢了"
            exit 1
          fi
          echo "符合预期：$(head -1 /tmp/err.txt)"

      # nginx -t 会**真的读证书文件**，所以得先有一张。用 1 天自签即可——
      # 这一步只验证配置语法，不验证证书链。
      - name: 生成临时自签证书
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/tls/privkey.pem" \
            -out    "$RUNNER_TEMP/tls/fullchain.pem" \
            -subj   "/CN=${CI_DOMAIN}" >/dev/null 2>&1
          openssl x509 -in "$RUNNER_TEMP/tls/fullchain.pem" -noout -subject

      # 先单独拉镜像：否则 `docker run` 的拉取进度会混进 nginx 的输出，
      # 真正那句 `[emerg] ...` 会被冲掉（我第一次就是这么丢了报错）。
      - name: 拉取 nginx 镜像
        run: docker pull "$NGINX_IMAGE"

      # 关键一步：容器启动时 entrypoint 会先把 templates/*.template 用 envsubst
      # 渲染成 conf.d/default.conf，然后才执行 `nginx -t`。所以这里验证的是
      # **渲染后**的配置，而不是模板原样——占位符写错会在这里暴露。
      #
      # 失败时的诊断顺序：原始输出 → 渲染后的配置。后者能直接看出
      # 「占位符有没有被替换」，比只看 emerg 行更快。
      - name: nginx -t（模板渲染后）
        run: |
          set -euo pipefail
          run_nginx() {
            docker run --rm \
              --add-host backend:127.0.0.1 \
              -v "$PWD/backend-java/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/backend-java/nginx/templates:/etc/nginx/templates:ro" \
              -v "$PWD/backend-java/nginx/conf.d:/etc/nginx/conf.d" \
              -v "$RUNNER_TEMP/tls:/etc/letsencrypt/live/${CI_DOMAIN}:ro" \
              -e "DOMAIN=${CI_DOMAIN}" \
              -e "BACKEND_UPSTREAM=backend:8080" \
              "$NGINX_IMAGE" "$@"
          }

          if ! out=$(run_nginx nginx -t 2>&1); then
            echo "::group::nginx -t 原始输出"
            printf '%s\n' "$out"
            echo "::endgroup::"
            echo "::group::渲染后的 server 配置"
            run_nginx sh -c 'sed -n "1,50p" /etc/nginx/conf.d/default.conf' 2>&1 || true
            echo "::endgroup::"
            err=$(printf '%s\n' "$out" | grep -Ei 'emerg|error|cannot|unknown|permission' | tail -1)
            echo "::error::nginx -t 失败：${err:-见上方 group 输出}"
            exit 1
          fi
          printf '%s\n' "$out"

      # `nginx -t` 只说明配置合法，不说明它**真的能服务**。
      # 这一步把它跑起来，验两件用户可见的事：
      #   /healthz → 200（容器健康检查依赖它，写错会导致容器永远 unhealthy）
      #   /api/works → 301（HTTP 必须跳到 HTTPS，否则等于明文服务）
      # 之所以能在没有后端的情况下验 /api/works：它在 location / 里，只做跳转，不反代。
      - name: 真起一次，验证 /healthz 与 301 跳转
        run: |
          set -euo pipefail
          # --add-host：`proxy_pass http://backend:8080` 里的 host 在**加载配置时**解析，
          # CI 里没有 compose 的 DNS，不补这条 nginx 会直接 [emerg] host not found。
          # 这条只补测试环境，生产配置不动——生产里 backend 由 compose 网络提供。
          docker run -d --name nginx-ci -p 18080:80 \
            --add-host backend:127.0.0.1 \
            -v "$PWD/backend-java/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/backend-java/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/backend-java/nginx/conf.d:/etc/nginx/conf.d" \
            -v "$RUNNER_TEMP/tls:/etc/letsencrypt/live/${CI_DOMAIN}:ro" \
            -e "DOMAIN=${CI_DOMAIN}" \
            -e "BACKEND_UPSTREAM=backend:8080" \
            "$NGINX_IMAGE"

          cleanup() { docker rm -f nginx-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- /healthz ---"
          body=$(curl -fsS --max-time 5 http://127.0.0.1:18080/healthz)
          echo "body=$body"
          [ "$body" = "ok" ] || { echo "::error::/healthz 返回 '$body'，期望 'ok'"; exit 1; }

          echo "--- 未匹配 Host 的请求不该落到 Nginx 欢迎页（conf.d 覆盖是否生效）---"
          root=$(curl -s --max-time 5 http://127.0.0.1:18080/)
          if printf '%s' "$root" | grep -qi "welcome to nginx"; then
            echo "::error::镜像自带的 default.conf 没被盖掉，欢迎页暴露了"
            exit 1
          fi

          echo "--- /api/works 应 301 到 https ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H "Host: ${CI_DOMAIN}" http://127.0.0.1:18080/api/works)
          loc=$(curl -s -o /dev/null -D - --max-time 5 -H "Host: ${CI_DOMAIN}" http://127.0.0.1:18080/api/works | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "status=$code location=$loc"
          [ "$code" = "301" ] || { echo "::error::期望 301，实际 $code"; exit 1; }
          case "$loc" in
            https://*) ;;
            *) echo "::error::Location 不是 https：$loc"; exit 1 ;;
          esac

      # 脚本语法。`bash -n` 只查语法，不查逻辑——但它能挡住「少一个 fi / done」
      # 这类在 cron 里静默失败的错。
      - name: 运维脚本语法
        run: |
          set -euo pipefail
          for f in backend-java/deploy/*.sh; do
            bash -n "$f"
            echo "OK $f"
          done
          # 可执行位丢了的话，cron 里 `./deploy/backup.sh` 会 permission denied
          for f in backend-java/deploy/*.sh; do
            [ -x "$f" ] || { echo "::error::$f 没有可执行位（cron 会跑不起来）"; exit 1; }
          done

  # 部署预演：把整套生产栈真起一遍。
  #
  # 为什么需要它：`config` 那个 job 只证明「配置能被读懂」。而部署日最容易出事的是
  # 编排本身——MySQL 起不来、Flyway 在空库上迁移失败、健康检查顺序不对、
  # nginx 找不到 backend、端口绑不上。这些**只有 up 的时候才会暴露**，
  # 而目前这条路径一次都没跑过。
  #
  # 代价是几分钟和一次镜像构建；换来的是「部署日不再是第一次运行」。
  stack:
    runs-on: ubuntu-latest
    needs: config
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 准备 CI 用的 .env
        working-directory: backend-java
        run: |
          set -euo pipefail
          cp .env.production.example .env
          sed -i \
            -e "s|^DOMAIN=.*|DOMAIN=${CI_DOMAIN}|" \
            -e "s|^OTAKU_PUBLIC_BASE_URL=.*|OTAKU_PUBLIC_BASE_URL=https://${CI_DOMAIN}|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=smoke-pass|" \
            -e "s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=smoke-root|" \
            -e "s|^OTAKU_INTERNAL_TOKEN=.*|OTAKU_INTERNAL_TOKEN=smoke-token|" \
            .env
          # 用高位端口：runner 上的 80/443 不一定空着，而这里要验的是编排不是端口。
          printf 'NGINX_HTTP_PORT=18080\nNGINX_HTTPS_PORT=18443\nBACKEND_PORT=18081\n' >> .env
          grep -E '^(DOMAIN|BACKEND_PORT|NGINX_)' .env

      # 模拟 init-letsencrypt.sh 的引导步骤：先塞一张自签证书，
      # 否则 Nginx 因为读不到证书根本起不来（compose 会一直 restart）。
      - name: 放一张自签证书（引导步骤）
        working-directory: backend-java
        run: |
          set -euo pipefail
          docker compose -f compose.prod.yaml run --rm --entrypoint sh certbot -c "
          set -e
          mkdir -p /etc/letsencrypt/live/${CI_DOMAIN} /etc/letsencrypt/archive/${CI_DOMAIN}
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/archive/${CI_DOMAIN}/privkey1.pem \
            -out    /etc/letsencrypt/archive/${CI_DOMAIN}/fullchain1.pem \
            -subj   '/CN=${CI_DOMAIN}' >/dev/null 2>&1
          ln -sf /etc/letsencrypt/archive/${CI_DOMAIN}/privkey1.pem   /etc/letsencrypt/live/${CI_DOMAIN}/privkey.pem
          ln -sf /etc/letsencrypt/archive/${CI_DOMAIN}/fullchain1.pem /etc/letsencrypt/live/${CI_DOMAIN}/fullchain.pem
          "
          echo "证书已就位"

      - name: 起整套生产栈（含构建后端镜像）
        working-directory: backend-java
        run: |
          set -euo pipefail
          docker compose -f compose.prod.yaml up -d --build
          docker compose -f compose.prod.yaml ps

      # 后端首次启动要跑 Flyway（9 个迁移，含 V7 的标签回填），空库上几十秒都正常。
      # 轮询走 Nginx，顺便验证「nginx 依赖 backend healthy」这条链路是通的。
      - name: 等后端 healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -kfsS --max-time 3 "https://127.0.0.1:18443/actuator/health" >/dev/null 2>&1; then
              echo "第 ${i} 次探测：UP"
              exit 0
            fi
            sleep 5
          done
          echo "::error::5 分钟内后端仍未 healthy"
          exit 1

      # nginx 的健康检查 interval 是 30s：容器刚起来时状态是 "starting"，
      # 而我们的验收链跑得比这还快，后面 monitor.sh 会看到 "starting" 并判失败。
      # 这一步既消掉那个时序噪声，也顺手断言「nginx 的健康检查真的能过」——
      # 健康检查写错的话，compose ps 永远显示 unhealthy，监控会一直叫。
      - name: 等所有容器 healthy
        run: |
          set -euo pipefail
          bad=""
          for i in $(seq 1 30); do
            bad=""
            for c in otaku-mysql otaku-backend otaku-nginx; do
              st=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$c" 2>/dev/null || echo missing)
              [ "$st" = "healthy" ] || bad="$bad $c=$st"
            done
            if [ -z "$bad" ]; then echo "全部 healthy（第 ${i} 次探测）"; exit 0; fi
            sleep 5
          done
          echo "::error::容器仍未 healthy:$bad"
          for c in otaku-mysql otaku-backend otaku-nginx; do
            echo "--- $c ---"
            docker inspect -f '{{json .State.Health}}' "$c" 2>/dev/null | head -c 700; echo
          done
          exit 1

      # 对应 docs/deploy-production.md §6 的验收清单，一条条自动化。
      - name: 上线验收（§6 的六条 + 两条补充）
        run: |
          set -euo pipefail
          B=https://127.0.0.1:18443
          fail() { echo "::error::$1"; exit 1; }

          echo "1) 健康检查"
          body=$(curl -kfsS --max-time 5 "$B/actuator/health")
          echo "   $body"
          printf '%s' "$body" | grep -q '"status":"UP"' || fail "health 不是 UP：$body"

          echo "2) 列表（空库 → 200 且 total=0）"
          json=$(curl -kfsS --max-time 10 "$B/api/works?page=1&page_size=2")
          echo "   ${json:0:160}"
          printf '%s' "$json" | grep -q '"total":0' || fail "空库 total 不是 0"
          # total_pages 是 #177 补的字段，这里顺手钉住，防再次漂移
          printf '%s' "$json" | grep -q '"total_pages"' || fail "列表缺 total_pages"

          echo "3) 不存在的作品详情 → 404"
          code=$(curl -ks -o /dev/null -w '%{http_code}' "$B/api/works/W-not-exist")
          echo "   $code"
          [ "$code" = "404" ] || fail "期望 404，实际 $code"

          echo "4) 不存在的封面 → 404"
          code=$(curl -ks -o /dev/null -w '%{http_code}' "$B/api/covers/W-not-exist")
          echo "   $code"
          [ "$code" = "404" ] || fail "期望 404，实际 $code"

          echo "5) /internal 走公网入口 → 404（Nginx 收口）"
          code=$(curl -ks -o /dev/null -w '%{http_code}' -X POST "$B/internal/import/batches" \
                   -H 'Content-Type: application/json' -d '{"batch_id":"x","source":"x","items":[]}')
          echo "   $code"
          [ "$code" = "404" ] || fail "期望 404，实际 $code"

          echo "6) /internal 绕过 Nginx 直连后端 → 401（token 校验仍在）"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:18081/internal/import/batches" \
                   -H 'Content-Type: application/json' -d '{"batch_id":"x","source":"x","items":[]}')
          echo "   $code"
          [ "$code" = "401" ] || fail "期望 401，实际 $code"

          echo "7) HTTP 入口 → 301 到 HTTPS"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/api/works")
          echo "   $code"
          [ "$code" = "301" ] || fail "期望 301，实际 $code"

          echo "8) 其余 actuator 端点不对外 → 404"
          code=$(curl -ks -o /dev/null -w '%{http_code}' "$B/actuator/env")
          echo "   $code"
          [ "$code" = "404" ] || fail "期望 404，实际 $code"

          echo "验收全部通过"

      # 有数据之后才谈得上验备份。走内部导入接口顺带证明：
      # token 通路是通的、Flyway 建的表能接住真实载荷。
      - name: 造一点数据（走内部导入接口）
        run: |
          set -euo pipefail
          cat > /tmp/batch.json <<'JSON'
          {"batch_id":"ci-smoke-1","source":"ci_smoke","fetched_at":"2026-01-01T00:00:00Z",
           "items":[
             {"source_id":"1","work_type":"anime","title":"冒烟测试作品 A","summary":null,
              "cover_url":null,"release_year":2020,"tags":["测试"],
              "main_rating":{"value":8.5,"scale":"0-10","source":"ci"},"source_url":null},
             {"source_id":"2","work_type":"anime","title":"冒烟测试作品 B","summary":null,
              "cover_url":null,"release_year":2021,"tags":null,"main_rating":null,"source_url":null}
           ]}
          JSON
          resp=$(curl -fsS -X POST "http://127.0.0.1:18081/internal/import/batches" \
                   -H "Content-Type: application/json" -H "X-Internal-Token: smoke-token" \
                   --data-binary @/tmp/batch.json)
          echo "$resp"
          printf '%s' "$resp" | grep -q '"inserted":2' || { echo "::error::导入没有插入 2 条"; exit 1; }
          echo "--- 列表应能看到 2 条 ---"
          curl -kfsS "https://127.0.0.1:18443/api/works?page_size=5" | head -c 200; echo

      # 「备份没验证过等于没备份」——这句话在文档里写了两遍，但一直没被执行过。
      # 这里真的 dump 一次，再恢复到一个**独立库**，比对行数。
      - name: 备份 → 恢复到独立库（证明备份真的能用）
        working-directory: backend-java
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
          # 生产的 1 MB 下限是为了挡住「dump 失败但没报错、只落了个空文件」。
          # 空库的 dump 只有几 KB，会撞上这个下限——这里显式调低，并把下限逻辑
          # 本身留给「有数据的真库」去守（那是它存在的意义）。
          MIN_SIZE_KB: "1"
        run: |
          set -euo pipefail
          DB=$(grep -E '^DB_NAME=' .env | cut -d= -f2)
          mkdir -p "$BACKUP_DIR"

          ./deploy/backup.sh
          dump=$(ls -1 "$BACKUP_DIR"/*.sql.gz | tail -1)
          echo "dump: $(basename "$dump") / $(du -k "$dump" | cut -f1) KB"

          docker compose -f compose.prod.yaml exec -T mysql sh -c \
            'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "DROP DATABASE IF EXISTS restore_check; CREATE DATABASE restore_check"'
          gunzip -c "$dump" | docker compose -f compose.prod.yaml exec -T mysql sh -c \
            'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" restore_check'
          echo "恢复完成"

          src=$(docker compose -f compose.prod.yaml exec -T mysql sh -c \
                  "exec mysql -N -B -uroot -p\"\$MYSQL_ROOT_PASSWORD\" -e 'SELECT COUNT(*) FROM $DB.work'" | tr -d '\r')
          dst=$(docker compose -f compose.prod.yaml exec -T mysql sh -c \
                  'exec mysql -N -B -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT COUNT(*) FROM restore_check.work"' | tr -d '\r')
          echo "源库 work=$src ｜ 恢复库 work=$dst"
          [ "$src" = "$dst" ] || { echo "::error::恢复后行数不一致：$src vs $dst"; exit 1; }
          [ "$src" -ge 2 ] || { echo "::error::源库只有 ${src} 行，导入没生效"; exit 1; }
          echo "行数一致，备份可用"

      # 巡检脚本此前只在桩环境里验过分支。这里让它面对一套**真的在跑**的栈：
      # 健康、三容器、磁盘、备份新鲜度都应该 OK；证书那项会因为用不上真实域名而 WARN
      # （WARN 不计失败），这正好验证「证书检查不会挂住整个巡检」。
      - name: 巡检脚本对真实栈的判断（健康时不该报错）
        working-directory: backend-java
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
          HEALTH_URL: http://127.0.0.1:18081/actuator/health
        run: |
          set -euo pipefail
          # runner 的系统盘常年 ~80% 占用（预装一堆 SDK），不代表生产环境。
          # 所以这条只验「健康时全绿、且磁盘检查能通过」，阈值本身交给下一条。
          if ! DISK_PATH=/ DISK_MAX_PCT=100 ./deploy/monitor.sh > /tmp/mon1.out 2>&1; then
            echo "::group::monitor 完整输出"
            cat /tmp/mon1.out
            echo "::endgroup::"
            # CI 日志接口不一定拿得到，所以把关键行塞进注解（上限 10 条，够用）
            n=0
            while IFS= read -r line; do
              case "$line" in
                \[FAIL\]*|\[WARN\]*) echo "::error::mon: $line"; n=$((n+1)) ;;
              esac
              [ "$n" -ge 8 ] && break
            done < /tmp/mon1.out
            if [ "$n" -eq 0 ]; then tail -5 /tmp/mon1.out | sed 's/^/::error::mon: /'; fi
            exit 1
          fi
          cat /tmp/mon1.out
          grep -q '巡检通过' /tmp/mon1.out || { echo "::error::没打出「巡检通过」"; exit 1; }

      # 只验「健康时不报错」是不够的——阈值如果永远不触发，那条检查等于没有。
      # 把阈值压到 1%，它必须失败，而且失败原因必须是磁盘。
      - name: 阈值确实会触发（否则「通过」没有意义）
        working-directory: backend-java
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
          HEALTH_URL: http://127.0.0.1:18081/actuator/health
        run: |
          set -euo pipefail
          if DISK_PATH=/ DISK_MAX_PCT=1 ./deploy/monitor.sh > /tmp/mon2.out 2>&1; then
            echo "::error::磁盘阈值压到 1% 仍然判通过——磁盘检查没有生效"
            exit 1
          fi
          grep -q 'FAIL.*磁盘' /tmp/mon2.out || {
            echo "::error::失败原因不是磁盘，说明是别的地方红了"
            tail -5 /tmp/mon2.out
            exit 1
          }
          echo "符合预期：$(grep 'FAIL.*磁盘' /tmp/mon2.out | head -1)"

      - name: 失败时打印日志
        if: failure()
        working-directory: backend-java
        run: |
          docker compose -f compose.prod.yaml ps || true
          echo '--- backend ---'
          docker compose -f compose.prod.yaml logs --tail 120 backend || true
          echo '--- nginx ---'
          docker compose -f compose.prod.yaml logs --tail 40 nginx || true
          echo '--- mysql ---'
          docker compose -f compose.prod.yaml logs --tail 40 mysql || true

      - name: 清理（含数据卷）
        if: always()
        working-directory: backend-java
        run: docker compose -f compose.prod.yaml down -v --remove-orphans || true
