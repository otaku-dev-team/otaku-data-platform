name: sync-python

on:
  push:
    branches: [main]
    paths:
      - "sync-python/**"
      - ".github/workflows/sync-python.yml"
  pull_request:
    paths:
      - "sync-python/**"
      - ".github/workflows/sync-python.yml"

permissions:
  contents: read

concurrency:
  group: sync-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sync-python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
