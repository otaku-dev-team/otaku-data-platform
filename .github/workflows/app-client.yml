name: app-client

on:
  push:
    branches: [main]
    paths:
      - "app-client/**"
      - ".github/workflows/app-client.yml"
  pull_request:
    paths:
      - "app-client/**"
      - ".github/workflows/app-client.yml"

permissions:
  contents: read

concurrency:
  group: app-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-client
    steps:
      - uses: actions/checkout@v7

      # 版本与本地开发环境对齐（Flutter 3.47.7 / Dart 3.13）。升级 Flutter 时
      # 同步改这里，否则 `flutter analyze` 的严格程度会和本地不一致。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 真的打包一次。2026-10-22 的教训（PR #80 引入、PR #88 修复）：
      # 资源文件注释里写了 `--dart-define`，其中连续两个连字符违反 XML 规范，
      # aapt 解析 debug 变体资源时直接失败。analyze 与 test 全绿，
      # 但 `flutter build apk` 在 main 上完全跑不起来——只有构建能发现它。
      # debug 不需要签名，runner 自带 Android SDK，成本约 2-3 分钟。
      - name: Build debug APK
        run: flutter build apk --debug
