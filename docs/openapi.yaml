openapi: 3.0.3

info:
  title: Otaku Data Platform · 接口契约（阶段 1–2）
  version: 1.1.0-draft
  description: |
    本文件是《第一阶段最小契约》（docs/stage1-minimal-contract.md）与
    《第二阶段契约草案》（docs/stage2-account-collection-contract.md）的机器可读版本。

    阶段 1（四个接口中的 HTTP 部分，以及 ③④ 共用的封面出口）：

    - **② 数据写入接口** `POST /internal/import/batches`（Python → Java）
    - **③ 作品列表接口** `GET /api/works`（Flutter → Java）
    - **④ 作品详情接口** `GET /api/works/{work_id}`（Flutter → Java）
    - **⑤ 封面代理接口** `GET /api/covers/{work_id}`（Flutter → Java）——
      `cover_url` 指向这里，不是来源站地址

    阶段 2（账号与个人数据，覆盖验收 C1–C11）：

    - `POST /api/auth/login`、`GET /api/auth/me`、`POST /api/auth/logout`
    - `GET|PUT|PATCH|DELETE /api/me/collections/{work_id}`、`GET /api/me/collections`
    - `POST /internal/accounts`（内部建号，**不是客户端契约**）

    **接口①「网站接入」不在本文件。** 那是平台**只读拉取**来源站，来源站的接口不由我们定义，
    接入规范（拿什么、不拿什么、网站需具备什么能力）见契约第 4 节。

    阶段 2 不提供自助注册、找回密码、refresh token、与来源站账号互通。
    本文件只描述请求与响应的**形状**；字段语义、可空规则、创建与更新规则以契约正文为准。

    **公共读限流（Issue #188 形态 A）**：`/api/works`、`/api/tags`、`/api/schedule`、`/api/articles`
    与 `/api/covers` 按来源 IP 限流（默认 600 次/分钟，封面 240 次/分钟；突发额度为每分钟额度的 1/4 与 1/2）。
    超限返回 `429 RATE_LIMITED` + `Retry-After`（秒），请按该值退避重试，不要立即重打。
    CORS 只放行配置的来源站与本地调试来源；Web 端跨域被拒时表现为 `403`。

    三条边界：
    1. 数据单向流动：网站 → 平台 → 客户端，平台不回写网站。
    2. 只有 Java 写业务数据库；Python 只经接口②提交。
    3. 空值一律 `null`，不用 `""`、`0`、"暂无" 之类的伪值填充。

    **成人内容可见性（2026-10-31 起）**：带成人标签（`R18`、`18X`、`里番`、`拔作`、`成人漫画`、
    `無修正` 等，判定名单在 `com.otaku.common.AdultTags`）**或标题里带成人标记**（`R18`、`18禁`、
    `18X`、`無修正`、`无码`、`Hentai`、`里番`）的作品**一律不下发**。具体口径：

    - 列表 / 搜索 / 标签筛选 / 年份筛选 / 榜单 / 相关推荐的 `items` 与 `total` 都不含它们；
    - 详情按 `work_id` 请求返回 `404 WORK_NOT_FOUND`（与 "不存在" 同一错误码，不暴露 "存在但被隐藏"）；
    - 标签词表不出现成人词，正常词的 `count` 也只统计可见作品；
    - 档期中带成人标签的条目整条不返回；收藏列表同样不展示；
    - 任何 `tags` 数组都**不含成人词**——作品只挂成人标签时该数组为 `[]`（与 "来源没给标签" 展示等价）。

    判定落在数据库列 `work.is_adult` / `work_tag.is_adult`（`V25` 迁移），不是查询时解析标签：
    实测查询时现算把列表计数从 86ms 拖到 2.7s。

    **名单与总开关自 2026-10-31 起可在运行期改**（`adult.tags` / `adult.title_markers` / `adult.hidden`，
    见 `GET /api/app/config` 与 `PUT /internal/app/config`）：改完会自动重算全库标记，
    不需要发版，也不再需要为加一个词写一条回填迁移（`V25` / `V26` 只是最初的存量回填）。
  contact:
    name: 契约讨论
    url: https://github.com/otaku-dev-team/otaku-data-platform/issues/3

servers:
  - url: http://localhost:8080
    description: |
      Java 后端默认端口。**此地址只适用于桌面端，以及在宿主机上直接调用接口的场景。**

      换端时必须改地址，不能照搬：
      - Android 模拟器 → `http://10.0.2.2:8080`（`10.0.2.2` 是模拟器访问宿主机的固定别名，`localhost` 在模拟器里指模拟器自身）
      - 真机 → 宿主机在局域网内的可达地址，且该地址要能被手机访问到

      阶段 1 验收口径明确要求：手机用可访问的服务地址联调，**不得把电脑的 `localhost` 当手机后端地址**。

tags:
  - name: 内部导入
    description: 仅供 Python 同步作业调用，客户端不得持有内部令牌
  - name: 作品查询
    description: Flutter 手机端与桌面端共用的公开读接口
  - name: 账号
    description: 阶段 2：登录、当前用户、退出。不开放自助注册
  - name: 个人收藏
    description: 阶段 2：本人收藏与观看状态，路径里永不出现 user_id
  - name: 内部账号
    description: 阶段 2：仅内网可用的建号接口，客户端不得持有内部令牌
  - name: 站主后台
    description: Issue #144。站主只能看/管自己站点的数据；路径与请求里都没有 site 参数，站点来自登录态
  - name: 内部站点
    description: 平台侧建站与开设站主；仅内网可用，站主后台里没有这些接口的调用点
  - name: 推送设备
    description: W1.3b：本人设备令牌登记与解绑，路径里永不出现 user_id

security: []

paths:

  /api/app/config:
    get:
      tags: [作品查询]
      summary: 运行期配置（公告 / 开关 / 成人遮挡口径）
      operationId: getAppConfig
      description: |
        客户端启动时拉一次，用来决定公告、功能开关这类**不发版就能改**的行为。

        约定：
        - `values` 是任意 JSON 的键值袋。客户端**只认自己认识的键**——后端加新键不需要客户端跟着发版，
          这是这一层唯一的价值，别把它写成强类型映射。
        - `version` 是配置版本（毫秒时间戳），客户端据此判断本地缓存要不要刷新；`0` = 库表还从没写过。
        - `adult.*` 三项**总是回显生效值**（库里没存过就是代码默认），运维改词表时直接在这份返回值上改。
        - 拉取失败可以直接忽略：客户端退回本地缓存 / 空配置，它只影响装饰性内容。

        已知键：

        | 键 | 形状 | 含义 |
        |---|---|---|
        | `app.notice` | `{enabled, text, url?, dismissible?}` | 首页公告条；`text` 为空或 `enabled=false` 即不显示 |
        | `adult.hidden` | `true` / `false` | 成人遮挡总开关；`false` = 整块下线（重建标记时全库清零） |
        | `adult.tags` | `string[]` | 成人标签名单；缺键用代码默认（60 个明确成人词） |
        | `adult.title_markers` | `string[]` | 标题兜底标记；缺键用代码默认 |
      responses:
        "200":
          description: 成功；库表为空时返回 version=0 与生效默认值
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works:
    get:
      tags: [作品查询]
      summary: 作品列表与关键词搜索（接口③）
      operationId: listWorks
      description: |
        分页返回作品列表。**列表不返回 `summary`**——来源简介最长 7225 字，会把列表响应撑爆。

        边界约定：
        - 无匹配时返回 `200` + `items: []` + `total: 0`，不是 404。
        - `page` 超出 `total_pages` 时返回 `200` + 空数组。
        - `page_size` 超过 50 时**按 50 截断**，不报错。
        - 排序由 `sort` 指定，默认 `id`；无论哪种排序都必须**稳定**（同一查询多次返回顺序一致）。
        - 成人内容（见文件头「成人内容可见性」）不出现在结果与 `total` 里；用成人词做 `tags`
          筛选会得到 `200` + 空结果（不是 400）。
      parameters:
        - name: type
          in: query
          description: 作品类型过滤，省略表示全部类型
          schema:
            type: string
            enum: [anime, comic, game, novel]
        - name: q
          in: query
          description: |
            标题关键词，子串匹配、忽略大小写。不支持别名与拼音
            （别名来源未出口，第一阶段做不到）。省略表示不过滤。
          schema: { type: string, maxLength: 100 }
        - name: tags
          in: query
          description: |
            **多标签筛选（AND：每个标签都必须命中）**，逗号分隔，最多 10 个。

            - 与 `tag` 的关系：`tag` 是单标签的**旧写法**（已标记 deprecated），
              `tags` 是它的推广；两者**不能同时出现**（同时传返回 `400`）。
            - 重复项去重、首尾空白忽略；空串等价于不筛选。
            - 每个标签超过 64 字符按 64 截断（与 `work_tag.tag` 列宽一致），不报错。
            - 未知标签**不报错**：只要有一个标签查不到，结果就是 `200` + 空数组。
            - **为什么是 AND 而不是 OR**：`tag` 原有的语义是"含有这个标签"，
              AND 是它的单调推广（选得越多、结果越窄），与排行榜/评分排序组合时语义稳定；
              OR 会让"再加一个标签"反而变宽，翻页与排序的解释成本更高。
              需要 OR 时客户端可分多次请求再合并（词表规模小，代价可控）。
          style: form
          explode: false
          schema:
            type: string
            example: 科幻,机战
        - name: tag
          in: query
          deprecated: true
          description: |
            **已废弃，请改用 `tags`。** 单标签精确匹配，等价于 `tags` 只有一个值。

            保留是为了不让已上线的旧调用立刻断掉；新代码不要再使用。
            与 `tags` 同时传入返回 `400`（不做"谁覆盖谁"的猜测）。
          schema: { type: string, maxLength: 64, example: 科幻 }
        - name: sort
          in: query
          description: |
            排序方式，省略等价于 `id`。三种取值都**降序在前**，并以 `id` 作次级键保证分页稳定：

            | 取值 | 顺序 | 无值作品（`null`） |
            | --- | --- | --- |
            | `id`（默认） | 入库顺序升序 | — |
            | `rating` | 评分高 → 低 | 排最后 |
            | `year` | 年份新 → 旧 | 排最后 |

            **非法取值返回 400**（`BAD_REQUEST`），与「查不到结果」区分开。
          schema:
            type: string
            enum: [id, rating, year]
            default: id
        - name: min_rating
          in: query
          description: |
            榜单评分下限：只返回评分 **≥** 该值的作品，**无评分（`null`）一律排除**。

            与 `sort=rating` 的「无评分沉底」互补：沉底只是排在最后、作品仍在结果里；
            榜单要的是「没有评分就不参与排名」，所以这里把它们移出结果集。
            `min_rating=0` 的语义是「只要有过评分」。可与 `type` / `q` / `tag` / `sort` 任意组合。

            尺度取 0–10（库内 `rating_scale` 当前均为 `0-10`）。非法值（非数字、负数、超上限）返回 `400`
            （`BAD_REQUEST`），与「筛出来是空的」区分开。
          schema: { type: number, minimum: 0, maximum: 10, example: 7.0 }
        - name: year
          in: query
          description: |
            **按上映 / 发售年份筛选**（等值）。省略表示不过滤。

            ⚠️ 与 `sort=year` 是两件事：`sort` 决定**顺序**，`year` 决定**结果集**。
            两者可以同时用（`?sort=year&year=2022` = 只看 2022 年的、按年份排——同一年的内部再按 id）。

            - **没有年份的作品（`null`）在带 `year` 时被排除**。这是有意的：
              用户点「2022」想看的就是 2022 年的，不该混进「不知道哪一年」的。
              要做「含未知年份」得单独加选项，不能悄悄把 `=` 改成「`IS NULL OR =`」。
            - 这一年没有作品时返回 `200` + `items: []` + `total: 0`（与未知标签同口径，
              筛选没结果是正常结果，不是错误）。
            - 非法值（非整数、超出 1900–2100）返回 `400`（`BAD_REQUEST`）——
              参数写错若被静默忽略，用户看到的是「全部作品」，会以为筛选坏了。
          schema: { type: integer, minimum: 1900, maximum: 2100, example: 2022 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 单页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPaging"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}:
    get:
      tags: [作品查询]
      summary: 作品详情（接口④）
      operationId: getWork
      description: |
        按 `work_id` 取全部 19 个字段。

        `work_id` 一律当作**不透明字符串**：不解析其结构，不做数值比较。
        不存在、格式非法、以及**成人内容被隐藏**，都返回 404，不用错误码区分"是否存在"。
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 成功，直接返回作品对象（不再套一层 data）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}/related:
    get:
      tags: [作品查询]
      summary: 同标签推荐（详情页底部，新增）
      operationId: getRelatedWorks
      description: |
        按**共享标签**取若干相关作品，供详情页底部「相关内容推荐」渲染。

        边界约定：
        - 作品不存在或 `work_id` 格式非法 → **404**（与详情一致）。
        - 作品**没有标签** → `200` + `basis_tags: []` + `items: []`，不是 404、不是空错误。
        - `limit` 省略为 6，超过 20 按 20 截断，不报错。
        - 排序为评分高 → 低（无评分排最后）；不返回作品自身。
        - **按标题去重**（trim + 小写归一的键，保留评分更高的那条）：多来源并存
          意味着同一作品可能有 2 条以上（实测 13,261 组跨源同名），不去重推荐位
          会连着出现同一个名字。去重后不足 `limit` 时**按实际数量返回**，不补位。

        `basis_tags` 是**本次实际参与匹配的标签**（最多 5 个），客户端据此展示
        「同题材：科幻、机战」这类理由。为空表示该作品没有标签，此时 `items` 必为空。
        成人词不参与匹配，也不会出现在 `basis_tags` 里；成人作品不会出现在 `items` 里。

        性能：依赖 `idx_work_rating` 反向扫描提前终止，55.6 万条实测约 3ms；
        不要改成「按共享标签数排序」，那需要全表算分（实测约 1s）。
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: limit
          in: query
          description: 返回条数，上限 20
          schema: { type: integer, minimum: 1, maximum: 20, default: 6 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelatedWorks" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/site/features:
    get:
      tags: [社区]
      summary: 本站能力开关（客户端据此决定内置评论区还是跳原页）
      operationId: getSiteFeatures
      description: |
        一个部署服务一个站，所以不需要站点参数。

        - `ugc_enabled: false` → 客户端作品页底部**跳来源站原页**，不渲染评论区；
        - `ugc_enabled: true` → 用 `GET /api/works/{work_id}/comments` 渲染内置评论区。

        解析不出「唯一 active 站点」时一律返回 `false`（fail-closed）：多站部署是将来形态，
        那时应给实例配站点标识，而不是在这里猜。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteFeatures" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}/comments:
    get:
      tags: [社区]
      summary: 作品评论列表（顶层评论，内嵌回复预览）
      operationId: listWorkComments
      description: |
        作品页评论区：只返回**顶层评论**，最新在前；每条带 `reply_count` 与最早 3 条回复预览。

        - `total` 是**顶层评论数**，不含回复——否则「20 条里 18 条是回复」会让翻页手感莫名其妙；
        - 完整回复走 `GET /api/works/{work_id}/comments/{comment_id}/replies`；
        - 作品不存在或 `work_id` 格式非法 → `404`（与详情一致）；
        - 作品存在但还没有评论 → `200` + `total: 0` + 空数组，不是 404；
        - `page_size` 上限 50，超出按 50 截断，不报错；
        - 未登录用户也能读（评论是公开内容）。

        数据边界：这些评论是**用户在我们客户端里写的**，不是来源站的内容；
        平台对来源站数据只读的红线不变。
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 每页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcCommentPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}/comments/{comment_id}/replies:
    get:
      tags: [社区]
      summary: 某条顶层评论下的全部回复（对话顺序）
      operationId: listCommentReplies
      description: |
        回复列表：只要 `published`，**最早在前**（对话顺序，与顶层列表的「最新在前」相反——
        读回复是顺着聊下来的，倒序会看不懂谁在回谁）。

        - `comment_id` 是**顶层评论**的 id，不是回复自己的 id；
        - 该评论不存在 / 不在本作品下 / 不是顶层 / 非 `published` → `404`；
        - 还没有回复 → `200` + `total: 0` + 空数组；
        - 未登录也能读。
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: comment_id
          in: path
          required: true
          schema: { type: string }
          description: 顶层评论 id
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 每页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcCommentPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}/reviews:
    get:
      tags: [社区]
      summary: 作品点评列表（打分 + 长评，一人一条）
      operationId: listWorkReviews
      description: |
        作品页「点评」tab：只返回 `published`，**最新在前**。

        点评与评论是两件事，不打通：
        - **点评**：对作品的评价，一人一条、可打分、可长文；
        - **评论**：讨论流，可多条、可回复（`/api/works/{work_id}/comments`）。

        - 作品不存在或 `work_id` 非法 → `404`；
        - 还没有点评 → `200` + `total: 0` + 空数组；
        - `page_size` 上限 50；未登录也能读。
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 每页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcReviewPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}/reviews/summary:
    get:
      tags: [社区]
      summary: 作品评分概览（均分 / 条数 / 分布）
      operationId: getWorkReviewSummary
      description: |
        只统计 `published`。三个数字口径不同，客户端不要混用：

        - `total`：点评总条数（**含只写文字不打分的**）；
        - `rated`：其中打了分的条数；
        - `average`：**只对打了分的求均值**（可为 `null`）。只写文字的点评不参与，
          否则会被当成 0 分把整部作品拉垮；
        - `distribution`：各分数的条数，没有的分数不出现（不补 0）。

        与来源站聚合分（`Work.main_rating`）**并列展示、不互相覆盖**——两套口径，
        混成一个数就再也分不清是谁的。
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcReviewSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/reviews:
    post:
      tags: [社区]
      summary: 发表点评（需登录，一人一条）
      operationId: createWorkReview
      description: |
        对一部作品发表点评。成功 `201` + 点评本体。

        - `rating` 与 `body` **至少一项非空**：只打分、只写评都行，两样都空 → `400`；
        - `rating` 1–10；`body` 纯文本、上限 5000 字，空白归一成 `null`；
        - 同一作品**只能有一条**：已存在 → `409 REVIEW_EXISTS`，客户端应引导去编辑；
        - 站点未开启社区 → `403`；作品不属于当前站点 → `403`；
        - 先审后发的站点：新点评落 `pending`，列表与概览都看不到；
        - 接入机器审核时：不合规 → `400 CONTENT_REJECTED`（**不落库**），拿不准 → `pending`；
          只打分的点评没有正文，不送审。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UgcReviewRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcReview" }
        "400":
          description: |
            校验失败（`BAD_REQUEST`）；或机器审核判定内容不合规（`CONTENT_REJECTED`，
            此时**不落库**，用户改完可直接重发）。
          content:/n            application/json:/n              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 已点评过这部作品（`REVIEW_EXISTS`）
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/reviews/{review_id}:
    patch:
      tags: [社区]
      summary: 修改自己的点评
      operationId: editWorkReview
      description: |
        只改 `rating` / `body`，作品与作者不可变。

        **省略的字段沿用原值**——只改评分时正文不会被清空。合并后至少要有一项非空。
        只能改自己的（别人的 `403`）；已隐藏或已撤回的返回 `404`。
        先审后发的站点改完回 `pending` 重审。
        改正文同样重新过机器审核，规则与发表一致。
      security:
        - bearerAuth: []
      parameters:
        - name: review_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UgcReviewEditRequest" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcReview" }
        "400":
          description: |
            校验失败（`BAD_REQUEST`）；或机器审核判定内容不合规（`CONTENT_REJECTED`，
            此时**不落库**，用户改完可直接重发）。
          content:/n            application/json:/n              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [社区]
      summary: 删除自己的点评（幂等）
      operationId: deleteWorkReview
      description: |
        **软删**（`status='deleted'`，保留行便于追溯），成功 `204`。

        幂等：重复删除、id 不存在都返回 `204`；删别人的返回 `403`。
      security:
        - bearerAuth: []
      parameters:
        - name: review_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已删除（或本来就不存在） }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/tags:
    get:
      tags: [作品查询]
      summary: 标签词表（供客户端做标签选择 / 筛选 UI）
      operationId: listTags
      description: |
        返回当前库里的标签及作品数，按 `count` 降序、`name` 升序（同分按名称保证稳定）。

        约定与取舍：
        - `total` 是**本次返回的条数**，不是词表总数（与首站同语义）。
        - 不分页：词表规模约 500 条/类（实测首站四类 197/118/130/104），
          一次返回足够；超过 `limit` 时截断，不报错。
        - `count` 是**作品数**，只统计当前快照；来源未提供标签的作品不计入任何标签
          （`WorkSummary.tags = null` 与 `[]` 都不产生词表行）。
        - **成人标签不出现在词表里**，且 `count` 只统计可见作品：一部 R18 作品挂的
          `科幻` 不会让 `科幻` 的计数虚高，也就不会出现 "词表说 949 部、点进去只有 700 部"。
        - 词表与作品列表同一份数据（`work_tag`），不额外维护白名单：
          来源站改名后旧词自然消失，不会出现"词表里有、筛出来是空"的幽灵标签。
      parameters:
        - name: type
          in: query
          description: 只统计该类型的作品；省略表示全部类型
          schema:
            type: string
            enum: [anime, comic, game, novel]
        - name: limit
          in: query
          description: 最多返回多少条；省略返回全部，上限 2000（超过按 2000 截断，不报错）
          schema: { type: integer, minimum: 1, maximum: 2000 }
      responses:
        "200":
          description: 成功；没有标签时返回空 items（不是 404）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/schedule:
    get:
      tags: [作品查询]
      summary: 每日新番档期（按星期分组）
      operationId: getSchedule
      description: |
        接口⑤：每日新番档期（公开，客户端可直连）。按星期分组返回当前/指定季度的档期。

        边界约定（与作品列表一致）：
        - 无匹配 → `200` + 空分组，不是错误；`season` 传不存在的值同样返回空分组，由客户端显示空状态。
        - `season` 省略 → 取库内最新季度；库里没有任何数据时 `season` 与 `seasons` 均为 `null`，`groups` 为 8 个空组。
        - `groups` 固定 8 组（周一…周日 + 待定），`weekday = null` 的待定组排在最后，与站点一致。
        - 某条档期命中本地作品时 `work_id` 非空，客户端可据此跳转本地详情；`null` 时只展示、不给死链。
      parameters:
        - name: season
          in: query
          required: false
          description: 季度编码（如 202504）；省略取库内最新季度
          schema: { type: string, pattern: "^[0-9]{6}$", example: "202504" }
      responses:
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePage" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/schedule/seasons:
    get:
      tags: [作品查询]
      summary: 可用季度列表
      operationId: listScheduleSeasons
      description: |
        全部可用季度，新的在前。给「切换季度」下拉用。库里没有任何档期时返回空数组。
      responses:
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "200":
          description: 成功，字符串数组（如 ["202504","202501"]），新的在前
          content:
            application/json:
              schema:
                type: array
                items: { type: string, pattern: "^[0-9]{6}$" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/covers/{work_id}:
    get:
      tags: [作品查询]
      summary: 作品封面代理（③④ 的配套出口）
      operationId: getWorkCover
      description: |
        取封面图片本体。列表与详情返回的 `cover_url` 指向这里，客户端只消费
        `cover_url`，**不直连来源站**（契约第 2.1 节）。

        边界约定：
        - `cover_url` 为 `null` 时客户端**不应**发起本请求，直接显示占位图（契约 6.3）。
        - 本地缓存未命中才回源一次，并按来源站限流缓存；命中后由平台直接服务，
          不再受来源站约 43 分钟缓存期影响。
        - 回源失败视为服务端错误，客户端按 `INTERNAL` 处理，不要退化成直连来源站。
        - `work_id` 与接口④ 同一条不透明字符串规则；不存在返回 `404`。
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 封面图片字节（不套 JSON 信封）
          headers:
            ETag:
              description: 内容指纹，客户端可用 `If-None-Match` 做协商缓存
              schema: { type: string }
            Cache-Control:
              description: 平台侧缓存策略；来源站自身缓存期仅约 43 分钟，此处由平台决定
              schema: { type: string }
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "304":
          description: If-None-Match 命中，客户端复用本地缓存（无响应体）
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/batches:
    post:
      tags: [内部导入]
      summary: 提交一个同步批次（接口②）
      operationId: submitImportBatch
      description: |
        Python 同步作业专用，不对外暴露。

        幂等：同一个 `batch_id` 重复提交返回首次结果，不重复入库。
        单批上限 500 条，超出返回 `413 BATCH_TOO_LARGE`，Python 需自行拆批。

        创建与更新规则：
        - `(source, source_id)` 未命中 → 创建；必填项缺失则整条 rejected。
        - 命中 → 只覆盖本次**出现且非 `null`** 的字段；`null` 表示本次没数据，不覆盖。
        - `tags: []` 表示明确无标签，会清空；`tags: null` 不清空。
          **第一阶段适配器只会发 `null`**——来源站的空标签是 `[]` 且无法区分"无标签/未录入"
          （实测 38.5% 为空），按"明确无标签"处理会在缺数据时误清空已有标签。
          `[]` 的语义保留给后续能区分两种空值的来源，见契约第 4.4.3 节。
        - `work_id` 首次创建时生成，此后不因内容变更而改变。
        - 来源侧消失的作品**不删除**。
        - **`source` 必须已登记到某个站点**（`site_source`）。库内已有站点时，未登记来源直接
          `400`：那批作品会出现在客户端列表里、评论却挂不上（`WORK_NOT_FOUND`）。
          空库（还没建站）例外，允许先灌数据再建站。2026-10-31 第二站演练实测过这条。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportBatchRequest" }
      responses:
        "200":
          description: 批次处理完成，逐条结果见 counts 与 errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/deletions:
    post:
      tags: [内部导入]
      summary: 软删一批作品（接口④）
      operationId: submitDeletions
      description: |
        Python 同步作业专用，不对外暴露。

        **软删，不物理删**：只打 `deleted_at` 时间戳。收藏、历史、外部引用都还指着这行，
        物理删等于替用户删数据，也没法在源站误删/回滚时恢复。

        下架之后：列表 / 搜索 / 标签 / 年份四个面全部**过滤掉**，详情仍返回
        `200 + deleted: true`（**不是 404**）。

        幂等：已软删的计 `already_deleted`，库里没有的计 `unknown`，**都不整批失败**——
        重发是常态，一批里有几条对不上不该让整批卡住。

        边界：只删 `source` 指定的这个来源的行，绝不跨来源删（否则一个站的数据能删掉另一个站的）。
        单批上限 500 条，超出返回 `413 BATCH_TOO_LARGE`。

        复活不走这里：源站又把作品放回来时走接口②，upsert 命中软删行会把 `deleted_at` 置空。
        删除名单应当由 sync 侧的内容指纹对比产出，且**只在整轮抓取无失败页时**才允许提交——
        否则一次网络抖动就能删掉一批。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionRequest" }
      responses:
        "200":
          description: 处理完成，三个计数见响应体
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/batches/{batch_id}:
    get:
      tags: [内部导入]
      summary: 查询批次结果（重跑前核对用）
      operationId: getImportBatch
      security:
        - internalToken: []
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: with_runs
          in: query
          required: false
          description: |
            传 `true` 时额外返回**逐次运行明细**；不传或传其它值，返回形状与阶段 1 完全一致。

            为什么需要：`batch_id` 由 source_id 集合哈希得出、不含运行序号，
            同一天重跑会覆盖汇总计数。要回答"这批推了几轮、哪轮 rejected 变多"，只能逐次记录。
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 成功（`with_runs=true` 时为 ImportBatchDetail，否则为 ImportBatchResult）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ImportBatchResult"
                  - $ref: "#/components/schemas/ImportBatchDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # 接口⑤：每日新番档期（内部导入侧，接口②的档期分支）
  # ---------------------------------------------------------------------------

  /internal/import/schedules:
    post:
      tags: [内部导入]
      summary: 提交一个档期同步批次（接口②档期侧）
      operationId: submitScheduleImportBatch
      description: |
        Python 同步作业专用，不对外暴露。与作品的 `/internal/import/batches` 平行：
        两种条目字段、校验、合并逻辑不同，故拆成独立端点而非共用一个带 entity 参数的端点。

        批次记录仍走同一张 import_batch 表，运维侧同一套口径。
        幂等、单批上限、创建/更新/`null` 不覆盖、`(source, source_id)` 唯一键、来源侧消失不删除——
        全部与 ImportBatchRequest 一致（见该 schema 说明）。
        差异：条目字段为档期侧（`ScheduleImportItem`），`work_tags` 收**数组**（站点给斜杠字符串，
        转换在同步侧做），`content_id` 原样透传，关联本地作品由后端按 `(source, source_id)` 尽力匹配。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleImportRequest" }
      responses:
        "200":
          description: 批次处理完成，逐条结果见 counts 与 errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # 阶段 3：最新资讯（与作品、档期平行的第三条条目线）
  # 资讯不是作品：无 work_id，正文只在详情给，source_url 是原文链接
  # ---------------------------------------------------------------------------

  /api/articles:
    get:
      tags: [最新资讯]
      summary: 一页最新资讯，按发布时间倒序
      operationId: listArticles
      description: |
        无匹配返回 200 + 空列表，与作品列表口径一致：「这个分类没数据」不是错误。
        未知分类同样返回空——分类是数据里的值不是接口枚举。
        资讯的 `tags` 与作品标签是同一套体系，成人词同样不出现（见文件头「成人内容可见性」）。
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: 分类筛选，省略不过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码从 1 起，小于 1 按 1 处理
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: 每页条数，上限 50，超出按 50 截断
      responses:
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "200":
          description: 一页资讯
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticlePage" }

  /api/articles/categories:
    get:
      tags: [最新资讯]
      summary: 全部分类（条数多的在前），给客户端的分类筛选用
      operationId: listArticleCategories
      responses:
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArticleCategory" }

  /api/articles/{articleId}:
    get:
      tags: [最新资讯]
      summary: 资讯详情（正文只在这里给，列表不带）
      operationId: getArticle
      description: |
        path 变量名沿用实现端的 `articleId`（Spring `@PathVariable` 按模板变量名绑定）。
        未知 id 返回 404 `ARTICLE_NOT_FOUND`。
      parameters:
        - name: articleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 资讯详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleDetail" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/app/config:
    put:
      tags: [内部导入]
      summary: 改一条运行期配置（改完即生效，不发版）
      operationId: putAppConfig
      description: |
        运维口子：改一条配置，**下一个请求就是新口径**，不用重启、不用发版。

        - 改 `adult.*` 时会**同步重算全库成人标记**，响应里的 `rebuild` 给出藏了多少部、
          同步了多少行、耗时多少毫秒。不重算就会出现「词表改了、旧作品还露着」的半生效状态。
        - `key` 必须小写字母开头、点分、不超过 64 字符；`value` 可以是标量 / 数组 / 对象。
        - 幂等：同一个 key 重复写同一个值不报错，只是 `version` 会变（客户端会再拉一次）。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConfigUpdate" }
      responses:
        "200":
          description: 已写入；改了 adult.* 时带 rebuild 结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigUpdateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /internal/app/config/adult-rebuild:
    post:
      tags: [内部导入]
      summary: 手工重算成人标记（绕过接口直接改库时的兜底）
      operationId: rebuildAdultFlags
      security:
        - internalToken: []
      responses:
        "200":
          description: 重算完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdultRebuildResult" }

  /internal/import/articles:
    post:
      tags: [内部导入]
      summary: 提交一个资讯同步批次（接口②资讯侧）
      operationId: submitArticleImportBatch
      description: |
        Python 同步作业专用，不对外暴露。与作品的 `/internal/import/batches`、档期的
        `/internal/import/schedules` 是三条平行的端点，而不是给现有端点加一个 entity
        参数：三种条目的字段、校验、合并逻辑都不同，合成一个端点会让请求体变成
        「带条件的联合类型」，出错时也分不清是哪一侧的问题。
        批次记录仍然走同一张 import_batch 表，运维侧同一套口径。

        幂等、单批上限、创建/更新/`null` 不覆盖、`(source, source_id)` 唯一键、来源侧消失不删除
        ——全部与 ImportBatchRequest 一致（见该 schema 说明）。
        差异：条目字段为资讯侧（`ArticleImportItem`）；`related_work_ids` 收**站点作品 id 原文**，
        不回填本地 work_id（来源站编辑推荐区块，回填会让客户端给出错误的本地跳转）。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleImportRequest" }
      responses:
        "200":
          description: 批次处理完成，逐条结果见 counts 与 errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # 阶段 2：账号与个人数据
  # 语义与错误处理以 docs/stage2-account-collection-contract.md 为准
  # ---------------------------------------------------------------------------

  /api/auth/login:
    post:
      tags: [账号]
      summary: 用户名密码换令牌（每次调用产生一条新会话）
      operationId: login
      description: |
        每次调用产生一条新会话，**不踢掉任何已有会话**（C1）。

        失败一律 `401 INVALID_CREDENTIALS`，不区分「用户不存在」与「密码错」，避免账号枚举。

        同一账号 5 次失败后进入限流：15 分钟滑动窗口，期间返回 `429 RATE_LIMITED`，
        `Retry-After` 给出还需等待的秒数。**只限流、不锁号**，窗口滑过自动恢复；
        成功登录会清空该账号的失败计数，正常用户不会被误伤。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功。`token` 只在此处返回一次，客户端自行安全保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: 账号或密码不正确（INVALID_CREDENTIALS）。不区分「用户不存在」与「密码错」
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/site-login:
    post:
      tags: [账号]
      summary: 站点授权票据换平台会话（令牌交换代理）
      operationId: siteLogin
      description: |
        阶段 2 账号绑定（Issue #242，契约 identity-linkup-contract.md §2）。

        App 先用系统浏览器打开站点 `/oauth/authorize`，回跳拿到一次性 `ticket`，再调本端点。
        **`client_secret` 只在平台后端**，客户端全程不见站点令牌。

        成功后的 `token` 与此前 `/api/auth/login` 发出的会话完全等价（同表、同 30 天 TTL、只存哈希）。

        **不落 ticket、不落站点令牌原文**：只存 `SHA-256(站点 access_token)` 与到期时间；
        `user.display_name` 透出站点昵称仅供本次展示，不落库、不再分发（契约 §7）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteLoginRequest" }
      responses:
        "200":
          description: 交换成功。`token` 只在此处返回一次，客户端自行安全保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            站点拒绝了本次授权（`INVALID_CREDENTIALS`）：票据过期、已被用过、`client_secret` 错。
            客户端应引导用户**重走一次授权**，不要静默重试。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: 该站点身份映射的平台账号已被禁用（`USER_DISABLED`），不发放会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: |
            站点侧暂不可用（`SITE_UNAVAILABLE`）：超时 / 5xx / 未配置。
            **不要引导重走授权**——重走也会失败，提示稍后再试即可。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/me:
    get:
      tags: [账号]
      summary: 校验令牌并返回当前用户
      operationId: getCurrentUser
      description: 客户端冷启动时用它判断是否已登录；失败只清会话，不弹错误页
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/auth/logout:
    post:
      tags: [账号]
      summary: 撤销当前令牌（只影响本设备）
      operationId: logout
      description: |
        只撤销当前令牌，其他设备的会话不受影响（C9）。

        **已失效或不带令牌调用也返回 `204`**，因此本接口不要求鉴权——
        客户端退出流程不应因为令牌已过期而卡在 401 分支上。无请求体。
      security: []
      responses:
        "204":
          description: 已撤销；或本来就没有有效会话（幂等）

  /api/me:
    delete:
      tags: [账号]
      summary: 注销自己的账号（匿名化保留）
      operationId: deleteAccount
      description: |
        账号注销。成功后 `204`，本机与**其他所有设备**的会话立刻失效。

        语义（2026-10-30 定，最终以站点/法务口径为准）：

        - 账号置 `disabled` + 记 `deleted_at`，之后**无法再登录**；用户名不释放
          （保留供追溯、防冒用，也避免「注销后别人抢注同名」）；
        - **评论默认保留**：作者显示「已注销用户」，楼层不塌。
          站点若配置为「注销即清空」，评论会在注销时被软删（公开列表立刻消失），
          物理清理由保留期作业兜底；
        - 注销不删账号行：`app_user` 被评论/举报/收藏/设备/会话五张表引用，
          删行等于连带抹掉这个人在别人楼下的回复。

        幂等：已注销后再调用会因会话失效返回 `401`，不会重复处理。
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 已注销（所有设备会话已失效）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/collections:
    get:
      tags: [个人收藏]
      summary: 本人收藏分页列表
      operationId: listCollections
      description: |
        - 排序：`updated_at DESC, work_id ASC`（第二个键保证同秒写入时分页不跳条）。
        - **不返回 `summary`**，与作品列表一致；也不返回 `tags` 与评分。
        - 空收藏返回 `200` + `items: []` + `total: 0`。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: |
            按观看状态过滤。省略表示全部；`none` 表示「已收藏但未设状态」。
          schema:
            type: string
            enum: [want, watching, watched, none]
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          description: 超过 50 时按 50 截断，不报错
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/me/collections/{work_id}:
    get:
      tags: [个人收藏]
      summary: 单条收藏状态（未收藏也是 200）
      operationId: getCollectionState
      description: |
        「未收藏」是正常结果，不是错误：返回 `200` + `collected: false`。
        只有**作品本身不存在**时才返回 `404 WORK_NOT_FOUND`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 成功（`collected` 区分是否已收藏）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionState" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [个人收藏]
      summary: 加入收藏（幂等 upsert）
      operationId: putCollection
      description: |
        记录不存在则创建，已存在则覆盖为给定 `status`；重复提交结果一致。
        `status` 可省略，表示收藏但不设状态。一律返回 `200`，不用 `201`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdateRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [个人收藏]
      summary: 只改状态、不创建（C11 的前提）
      operationId: patchCollection
      description: |
        **只改不建**：记录不存在时返回 `409 COLLECTION_REQUIRED`，绝不自动重新收藏。
        这是验收 C11（过期界面改状态）成立的唯一方式；用 `PUT` 会静默重建收藏、C11 直接失败。

        `status` 传 `null` 表示清除状态但保留收藏。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdateRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "409": { $ref: "#/components/responses/ConflictCollection" }

    delete:
      tags: [个人收藏]
      summary: 取消收藏（幂等）
      operationId: deleteCollection
      description: 删除整条记录，`status` 随之消失（C4）；记录不存在也返回 `204`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "204":
          description: 已取消（或本来就没收藏）
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/me/comments:
    post:
      tags: [社区]
      summary: 发表评论（需登录）
      operationId: createWorkComment
      description: |
        在当前站点的作品下发一条评论。成功返回 `201` + 评论本体。

        约束：
        - `body` 是**纯文本**，1–1000 字，原样存储、不做 HTML/Markdown 解析；
          超出长度返回 `400`，**不截断**（截断等于悄悄改用户写的内容）；
        - 防刷屏：同一用户 **60 秒内最多 5 条**，超出 `429 RATE_LIMITED`；
        - 作品必须存在且属于当前登录用户的站点，否则 `404` / `403`；
        - 发布状态跟随站点开关：先发后审 → `published`，先审后发 → `pending`；
        - 若站点接入了机器审核（#240 B2c）：判定不合规 → `400 CONTENT_REJECTED`（**不落库**），
          拿不准 → 落 `pending` 转人工；未接入（默认）时行为与接入前完全一致。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UgcCommentRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcComment" }
        "400":
          description: |
            校验失败（`BAD_REQUEST`）；或机器审核判定内容不合规（`CONTENT_REJECTED`，
            此时**不落库**，用户改完可直接重发）。
          content:/n            application/json:/n              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/comments/{comment_id}:
    delete:
      tags: [社区]
      summary: 删除自己的评论（幂等）
      operationId: deleteWorkComment
      description: |
        **软删**（`status='deleted'`，保留行便于追溯），成功后 `204`。

        幂等：重复删除、或 id 根本不存在，都返回 `204`；删别人的评论返回 `403`——
        不装作删掉了，也不泄露别人的评论是否存在。
      security:
        - bearerAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已删除（或本来就不存在） }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [社区]
      summary: 修改自己的评论正文
      operationId: editWorkComment
      description: |
        只能改 `body`。作品归属、作者、父评论都不可变——允许改 `parent_id` 等于把一条回复搬走，
        会让别人的楼层出现缺口（要换个位置说，删了重发即可）。

        - 只能改自己的（别人的 `403`）；
        - 只接受 `published` / `pending`：已隐藏（站主处置过）或已撤回的返回 `404`，
          不泄露「这条其实还在、只是被藏了」；
        - **先审后发的站点里，编辑会重新落回 `pending`**——否则「先发合规内容过审、再改成违规」
          就是一条现成的绕过路径；
        - 校验与发表一致：空白 `400`、超 1000 字 `400`（不截断）；
        - 成功后 `200` + 评论本体，`edited_at` 有值。编辑响应里顶层评论的 `replies` 是空数组，
          客户端应保留已有预览、只替换这条本身，不要把整条替换成「零回复」；
        - 改完**重新过机器审核**：判定不合规 `400 CONTENT_REJECTED`，拿不准落 `pending`。
      security:
        - bearerAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UgcCommentEditRequest" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UgcComment" }
        "400":
          description: |
            校验失败（`BAD_REQUEST`）；或机器审核判定内容不合规（`CONTENT_REJECTED`，
            此时**不落库**，用户改完可直接重发）。
          content:/n            application/json:/n              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/comment-reports:
    post:
      tags: [社区]
      summary: 举报一条评论（需登录）
      operationId: reportWorkComment
      description: |
        提交举报工单。**不会自动隐藏评论**——处置是站主的动作，否则任何人一个点击就能下架内容。

        - `201` = 新建工单；`200` = 之前举报过（同一人对同一条评论只有一张工单，不堆队列）；
        - 不能举报自己的评论（`400`，自己的评论请用删除）；
        - 理由 1–200 字纯文本，只给站主/平台处置时看，不对外展示。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentReportRequest" }
      responses:
        "200":
          description: 已存在工单（返回原工单）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentReport" }
        "201":
          description: 工单已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/devices:
    post:
      tags: [推送设备]
      summary: 登记或更新本设备令牌（upsert）
      operationId: registerDevice
      description: |
        **upsert 键是 `(user_id, device_id)`，不是 token**：token 会轮换，device_id 不会；
        用 token 当键会在每次轮换时留下一条僵尸记录。

        **token 全局唯一，跨账号转移**：同一台设备换账号登录时，新账号注册同一个 token，
        旧账号那条**立即失效**。否则前一个用户退出登录后，这台设备仍会收到他的推送，
        而通知会直接显示在锁屏上。与收藏按账号隔离是同一类问题，后果更直接。

        token 轮换后重新 `POST` 即可覆盖（客户端在 provider 的 `onTokenRefresh` 时调）。

        **响应永不回显 `token`**：那是凭据，客户端本来就有，回显只增加泄露面。

        每账号最多登记 10 台设备，超出返回 `409 DEVICE_LIMIT_EXCEEDED`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistrationRequest" }
      responses:
        "201":
          description: 新建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "200":
          description: 已存在，更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "409": { $ref: "#/components/responses/DeviceLimitExceeded" }

    get:
      tags: [推送设备]
      summary: 列出本账号已登记的设备
      operationId: listDevices
      description: |
        **不返回 `token`**。按 `created_at DESC` 排序。
        客户端用它来展示「这台设备已登记推送」的状态。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/me/devices/{device_id}:
    delete:
      tags: [推送设备]
      summary: 解绑本设备（幂等）
      operationId: deleteDevice
      description: |
        记录不存在也返回 `204`（与收藏删除的幂等口径一致）。
        客户端在登出时应先 `DELETE` 再撤销会话；**删失败不阻断登出**。
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: 客户端生成的安装级标识
          schema: { type: string, maxLength: 64 }
      responses:
        "204":
          description: 已解绑（或本来就没登记）
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /internal/accounts:
    post:
      tags: [内部账号]
      summary: 内部建号（首期不开放自助注册）
      operationId: createAccount
      description: |
        联调账号 A / B 由此创建。客户端**不得**持有内部令牌，因此该接口不对外暴露。
        不返回会话：建号后仍需走 `POST /api/auth/login`。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ConflictUsername" }

  # ---------------------------------------------------------------------------
  # 阶段 3：站主运营后台（Issue #144）
  # 依据 docs/site-owner-console-proposal.md §2–§4、§8
  #
  # 与客户端 /api/auth/** 是两套独立凭据：不同表、不同令牌（后台 12 小时 / 客户端 30 天）。
  # 一条贯穿全段的规则：**没有任何请求参数携带站点标识**，站点只能来自登录态。
  # 越权（目标资源属于别的站点）返回 403，契约要求 403 而非 404。
  # ---------------------------------------------------------------------------

  /api/console/auth/login:
    post:
      tags: [站主后台]
      summary: 站主登录（平台账号过渡态）
      operationId: consoleLogin
      description: |
        站主用自己站点的管理员账号登录后台。

        当前是提案 §4.1 的过渡态 C：平台侧建号（`/internal/site-admins`）+ 站主名单校验。
        网站 OAuth（#147）就绪后切到方案 B（网站账号 + 名单），表结构已预留
        `identity_source` / `external_user_id`，后台接口与页面不需要改。

        失败一律 `401 INVALID_CREDENTIALS`，不区分「账号不存在」与「密码错」。
        **账号或站点被停用**时，口令正确的前提下返回 `403`：这需要先猜对密码，
        不构成账号枚举；若也返回 401，站主只会反复重置密码，永远看不到真正的原因。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsoleLoginRequest" }
      responses:
        "200":
          description: 登录成功。`token` 只在此处返回一次
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/auth/me:
    get:
      tags: [站主后台]
      summary: 当前站主与所属站点
      operationId: consoleMe
      description: 后台页面刷新时用它判断登录态是否还有效；站点名从这里取，不从本地缓存拼
      security:
        - consoleAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleMe" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/console/auth/logout:
    post:
      tags: [站主后台]
      summary: 撤销当前后台会话
      operationId: consoleLogout
      description: 与客户端一致：不带令牌或已失效也返回 `204`，退出流程不卡在 401 分支上
      security: []
      responses:
        "204":
          description: 已撤销；或本来就没有有效会话（幂等）

  /api/console/auth/password:
    post:
      tags: [站主后台]
      summary: 修改自己的后台口令
      operationId: consoleChangePassword
      description: |
        配合二期「站主可自助新增站主」：新站主拿到初始口令后必须能自己改，
        否则口令只能通过聊天工具长期流转。

        旧口令错误返回 `401 INVALID_CREDENTIALS`；新口令长度 8–72、不能与旧口令相同（`400`）。
        成功后撤销**其它设备**的后台会话，当前设备保留——改口令的常见场景是怀疑泄露，
        把当前设备一起踢掉会让用户以为改失败了。
      security:
        - consoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsolePasswordChangeRequest" }
      responses:
        "204": { description: 已修改 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/console/ugc:
    get:
      tags: [站主后台]
      summary: 本站评论列表（审核用）
      operationId: listConsoleUgc
      description: |
        按登录站主的站点过滤（**不接受站点参数**）。`status` 可选
        `published` / `hidden` / `deleted` / `all`（缺省 = 全部），最新在前。
      security:
        - consoleAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [published, pending, hidden, deleted, all] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUgcPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/ugc/{comment_id}/hide:
    post:
      tags: [站主后台]
      summary: 隐藏一条评论
      operationId: hideConsoleUgc
      description: |
        隐藏后客户端列表立刻不可见（`status=hidden`），但数据保留、可随时恢复。
        幂等：已隐藏再点一次不报错、不重复记审计。跨站 id 返回 `404`，不是悄悄改。
      security:
        - consoleAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 隐藏后的最新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUgcItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/ugc/{comment_id}/publish:
    post:
      tags: [站主后台]
      summary: 恢复一条被隐藏的评论
      operationId: publishConsoleUgc
      description: 与隐藏对称；已发布的再恢复一次不报错。
      security:
        - consoleAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 恢复后的最新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUgcItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/ugc/export:
    get:
      tags: [站主后台]
      summary: 导出本站 UGC（评论 / 点评 / 举报，各一份 CSV）
      operationId: exportConsoleUgc
      description: |
        数据交还客户：把本站的 UGC 导成 CSV（UTF-8 带 BOM，Excel 直接打开不乱码）。

        **为什么要导三份**：站点下线时删的是三张表（`ugc_comment` / `ugc_review` /
        `ugc_report`），所以「交还」也必须覆盖这三类，否则就是「删了但没交」。
        三类的列天然不同（点评有评分、举报有理由），合成一张表站主分不清哪列对哪行，
        因此用 `type` 分开，**每次请求一份文件**。三个文件名不同，下到同一目录不会互相覆盖。

        - `type`：`comment`（缺省）/ `review` / `report`。认不出的值 `400`——
          不静默降级成评论，否则站主会以为「我的点评就这些」；
        - 按登录站主的站点过滤，**不接受站点参数**；
        - `status` 的取值跟着 `type` 走：评论与点评是 `published` / `pending` / `hidden` /
          `deleted` / `all`；举报是 `open` / `resolved` / `dismissed` / `all`（缺省 = 全部）；
        - 上限 **5 万行**：超过时正常返回前 5 万行并把 `X-Export-Truncated` 置为 `true`（**不报错**，
          站主要的是「能拿到数据」，报错只会让他反复重试）；
        - 每行字段按 RFC 4180 转义（逗号、引号、换行都安全）；响应头 `X-Export-Rows` 是本文件行数；
        - 导出会写审计 `ugc.export`（谁在什么时候导了哪一类、多少条）。

        **对账规矩**：下线前 `X-Export-Rows` 必须与 `scripts/site-offboarding.sql` 干跑输出的
        `comments` / `reviews` / `reports` 逐项相等，不等不许删（2026-10-31 演练的口径）。
      security:
        - consoleAuth: []
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [comment, review, report], default: comment }
          description: 导哪一类。缺省 `comment`（与加这个参数之前的行为一致）。
        - name: status
          in: query
          schema: { type: string, enum: [published, pending, hidden, deleted, open, resolved, dismissed, all] }
          description: |
            状态过滤。评论/点评用 published / pending / hidden / deleted；
            举报用 open / resolved / dismissed。取值不属于当前 `type` 时 `400`。
      responses:
        "200":
          description: CSV 文件
          headers:
            X-Export-Rows:
              schema: { type: integer }
              description: 本次导出的行数
            X-Export-Truncated:
              schema: { type: boolean }
              description: 是否因为 5 万行上限被截断
            X-Export-Kind:
              schema: { type: string, enum: [comment, review, report] }
              description: 本次导出的是哪一类（与请求的 type 一致，缺省请求时为 comment）
            Content-Disposition:
              schema: { type: string }
              description: |
                attachment; filename="<prefix><site_key>-<yyyy-MM-dd>.csv"，
                prefix 为 `ugc-`（评论）/ `reviews-`（点评）/ `reports-`（举报）
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/ugc/reports:
    get:
      tags: [站主后台]
      summary: 举报工单队列
      operationId: listConsoleUgcReports
      description: |
        按登录站主的站点过滤。`status` 可选 `open` / `resolved` / `dismissed` / `all`（缺省 = 全部），
        最新在前。每条工单带被举报评论的正文、作者与作品标题，处置时不用再点进去查。
      security:
        - consoleAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed, all] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleReportPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/ugc/reports/{report_id}/resolve:
    post:
      tags: [站主后台]
      summary: 采纳举报（隐藏评论 + 关单）
      operationId: resolveConsoleUgcReport
      description: |
        两步在同一个事务里：把被举报评论置为 `hidden`，工单置为 `resolved`。
        已处理的再点一次不改变处理人与时间（幂等）。写审计 `ugc.report_resolve`。
      security:
        - consoleAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 处理后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleReportItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/ugc/reports/{report_id}/dismiss:
    post:
      tags: [站主后台]
      summary: 驳回举报（不动评论）
      operationId: dismissConsoleUgcReport
      description: 只把工单标为 `dismissed`，**评论保持原状**。写审计 `ugc.report_dismiss`。
      security:
        - consoleAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 处理后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleReportItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/site/ugc:
    get:
      tags: [站主后台]
      summary: 本站社区开关
      operationId: getConsoleUgcSetting
      description: |
        默认 `false`。这是**产品决定**（要不要在自己站上承载用户内容），
        由站主自己开，平台不代劳。
      security:
        - consoleAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteUgcSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [站主后台]
      summary: 开关本站社区
      operationId: updateConsoleUgcSetting
      description: |
        变更会写审计（`ugc.setting`）：谁在什么时候开/关，必须能查。

        - 关：客户端写接口 403，`/api/site/features` 返回 `false`；
        - 开：恢复写入。**已有的评论不会因为关开关被删除**。
      security:
        - consoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteUgcSettingUpdate" }
      responses:
        "200":
          description: 变更后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteUgcSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/console/overview:
    get:
      tags: [站主后台]
      summary: 本站数据概览（作品数 / 字段覆盖率 / 同步摘要）
      operationId: consoleOverview
      description: |
        覆盖率口径与 `scripts/data-coverage.sql` 完全一致，不另立一套：
        空串与 NULL 都算「没有」；`rating_value` 为 NULL 是**无评分**（不是 0 分）；
        `tags_provided`（来源提供了标签）与 `tags_nonempty`（标签非空）分开统计。

        站点没有配置任何来源时返回 0 与空列表，**不会**退化成"不加过滤看全库"。
      security:
        - consoleAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleOverview" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/console/users:
    get:
      tags: [站主后台]
      summary: 本站客户端用户列表
      operationId: consoleListUsers
      description: |
        只返回 `site_key` 等于登录站点的账号。历史账号（`site_key` 为空）**不出现在任何站点的列表里**。

        `active_sessions` 是当前有效会话数，用来解释"我禁了他，他为什么还连着"——
        正常情况下禁用会当场撤销全部会话，这个数字会归零。
      security:
        - consoleAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 省略表示全部
          schema:
            type: string
            enum: [active, disabled]
        - name: q
          in: query
          required: false
          description: 用户名子串匹配（`%` 与 `_` 按普通字符处理）
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          description: 超过 50 时按 50 截断，不报错
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/console/users/{user_id}:
    get:
      tags: [站主后台]
      summary: 本站用户详情（二期）
      operationId: consoleUserDetail
      description: |
        基本信息 + 活跃会话数 + 收藏聚合。收藏**明细**走
        `/api/console/users/{user_id}/collections`——一个人可能收藏上千条，
        塞进详情会让这个接口变成「一次拉全量」的入口，而站主多数时候只想看总数。

        归属校验与禁用一致：不存在 → `404 USER_NOT_FOUND`；
        存在但属于别的站点（含 `site_key` 为空的历史账号）→ `403 FORBIDDEN`。
      security:
        - consoleAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUserDetail" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /api/console/users/{user_id}/collections:
    get:
      tags: [站主后台]
      summary: 本站用户的收藏明细（二期）
      operationId: consoleUserCollections
      description: |
        按 `updated_at` 降序分页。`status` 可过滤 `want` / `watching` / `watched` / `none`
        （`none` = 已收藏但未设状态，与客户端契约一致）；非法值 `400`。

        先校验用户归属、再查收藏：不存在 `404`，属于别站 `403`。
        封面走平台代理地址（与客户端看到的一致），不把来源站暴露给后台页面。
      security:
        - consoleAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: status
          in: query
          description: 收藏状态过滤；省略表示全部
          schema: { type: string, enum: [want, watching, watched, none] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 单页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUserCollectionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /api/console/users/{user_id}/disable:
    post:
      tags: [站主后台]
      summary: 禁用本站用户（只封客户端登录）
      operationId: consoleDisableUser
      description: |
        **只影响客户端登录，不影响网站账号。** 平台不回写网站侧账号状态
        （提案 §4.2 已拍板）：网站账号的存废是网站自己的事，站主禁用 ≠ 用户本人授权。

        效果有两层，缺一不可：

        1. `app_user.status = disabled` → 之后的登录返回 `403 USER_DISABLED`；
        2. 撤销该用户**全部**平台会话 → 已登录的设备立刻掉线，不用等 30 天过期。

        重复调用幂等：已经禁用时返回同样的结果，不再撤一遍会话。

        站点不符（含 `site_key` 为空的历史账号）返回 `403`；账号不存在返回 `404 USER_NOT_FOUND`。
      security:
        - consoleAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsoleUserStatusRequest" }
      responses:
        "200":
          description: 成功（`note` 是给站主看的原话：禁用 ≠ 封网站账号）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUserStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /api/console/users/{user_id}/enable:
    post:
      tags: [站主后台]
      summary: 解禁本站用户
      operationId: consoleEnableUser
      description: 恢复客户端登录。此前的会话不会自动恢复，用户需要重新登录（刻意如此）。
      security:
        - consoleAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleUserStatusChange" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }

  /api/console/admins:
    get:
      tags: [站主后台]
      summary: 本站站主名单（二期）
      operationId: consoleListAdmins
      description: |
        只列本站的站主。`self=true` 标记当前登录的这位，供前端禁用「停用自己」按钮；
        后端仍会拒绝该操作——规则不能只活在前端。
      security:
        - consoleAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsoleAdminItem" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

    post:
      tags: [站主后台]
      summary: 新增本站站主（二期）
      operationId: consoleCreateAdmin
      description: |
        站主可以自助邀请**本站**同事（提案 §8 第 3 条）。新增的人只能管理本站数据；
        站点接入与配置仍然只在 `/internal/**`，不在后台暴露。

        用户名**全局唯一**（站主登录时不需要先选站点），冲突返回 `409 USERNAME_TAKEN`。
        初始口令由操作者设置并线下转告；平台只存 BCrypt，**响应里不回显任何口令**。
      security:
        - consoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsoleAdminCreateRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleAdminCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "409": { $ref: "#/components/responses/ConflictUsername" }

  /api/console/admins/{admin_id}/disable:
    post:
      tags: [站主后台]
      summary: 停用本站站主（二期）
      operationId: consoleDisableAdmin
      description: |
        改状态 + 撤销该站主全部后台会话。两条护栏：

        - 不能停用自己（`400`）——手滑就再也进不来。有这一条之后，本站不会被这个接口
          清空站主：操作者自己必然是 active，停别人不会让站点失去管理入口；
        - 目标必须属于本站：不存在 `404 ADMIN_NOT_FOUND`，属于别站 `403 FORBIDDEN`。

        重复调用幂等（已停用时 `revoked_sessions = 0`）。
      security:
        - consoleAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminId"
      responses:
        "200":
          description: 已停用（或本就停用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleAdminStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AdminNotFound" }

  /api/console/admins/{admin_id}/enable:
    post:
      tags: [站主后台]
      summary: 恢复本站站主（二期）
      operationId: consoleEnableAdmin
      description: 恢复后对方需重新登录；停用时撤销的会话不会自动恢复。
      security:
        - consoleAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminId"
      responses:
        "200":
          description: 已恢复（或本就可用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleAdminStatusChange" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AdminNotFound" }

  /api/console/sync:
    get:
      tags: [站主后台]
      summary: 同步状态（最近一次 / 近期运行 / 失败条目）
      operationId: consoleSyncStatus
      description: |
        `summary.status` 四态：`never` 从没跑过、`ok`、`partial`（有拒收）、
        `failed`（最近一次没有收尾时间，通常是被中断）。**先判 `failed`**：
        中断的运行如果只按"有没有拒收"判断，会显示成成功。

        **只读，后台不提供触发同步的入口**（提案 §9：手动触发属二期）——
        那等于给站主一个能打满来源站的按钮，而限速责任在平台侧。
        失败补齐 = `failed_items` 里的 `source_id` + `retry_hint` 里那条平台侧命令。
      security:
        - consoleAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleSyncStatus" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/sites:
    post:
      tags: [内部站点]
      summary: 平台侧建站（含来源绑定）
      operationId: createSite
      description: |
        站点接入是**底座核心能力**，只在这里开放（提案 §2.2），站主后台没有任何调用点。

        `sources` 至少一项：没有来源的站点在后台什么都看不到。
        一个 `source` 只能属于一个站点（`uk_site_source` 唯一索引）——
        允许共用的话，A 站的作品会同时出现在 B 站后台，任何过滤都说不清。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCreateRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/site-admins:
    post:
      tags: [内部站点]
      summary: 平台侧开设站主（加入站主名单）
      operationId: createSiteAdmin
      description: |
        提案 §8 第 3 条：站主名单在网站接入时由我们配置。

        用户名全局唯一（站主登录时不需要先选站点）。不返回会话、不返回密码。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAdminCreateRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteAdminCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ConflictUsername" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/sites/{site_key}/disable:
    post:
      tags: [内部站点]
      summary: 平台侧停用站点（该站全部站主立即失去后台）
      operationId: suspendSite
      description: |
        site.status 置为 suspended，并撤销该站**所有站主**的后台会话——
        只改状态挡得住下一次登录，挡不住已经打开的后台页面。

        客户端数据（作品、用户、收藏）原样保留；恢复后原样可见。
        幂等：重复调用不报错，返回 revoked_admin_sessions = 0。
      security:
        - internalToken: []
      parameters:
        - name: site_key
          in: path
          required: true
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: 已停用（或本就停用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/sites/{site_key}/enable:
    post:
      tags: [内部站点]
      summary: 平台侧恢复站点
      operationId: resumeSite
      description: |
        site.status 置回 active。停用时撤销的站主会话**不会**自动恢复，站主需重新登录。
        幂等：重复调用不报错。
      security:
        - internalToken: []
      parameters:
        - name: site_key
          in: path
          required: true
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: 已恢复（或本就在用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/site-admins/{admin_id}/disable:
    post:
      tags: [内部站点]
      summary: 平台侧停用单个站主
      operationId: disableSiteAdmin
      description: |
        site_admin.status 置为 disabled 并撤销其全部后台会话。站点本身与其他站主不受影响。
        按响应里的 note 原样理解：停的是站主，不是站点。
        幂等：重复调用不报错，返回 revoked_sessions = 0。
      security:
        - internalToken: []
      parameters:
        - name: admin_id
          in: path
          required: true
          schema: { type: string, maxLength: 32, description: "`G-` 前缀，不暴露自增主键" }
      responses:
        "200":
          description: 已停用（或本就停用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteAdminStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/AdminNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/site-admins/{admin_id}/enable:
    post:
      tags: [内部站点]
      summary: 平台侧恢复单个站主
      operationId: enableSiteAdmin
      description: |
        site_admin.status 置回 active。撤销过的会话不会恢复，站主需重新登录。
        幂等：重复调用不报错。
      security:
        - internalToken: []
      parameters:
        - name: admin_id
          in: path
          required: true
          schema: { type: string, maxLength: 32, description: "`G-` 前缀，不暴露自增主键" }
      responses:
        "200":
          description: 已恢复（或本就在用）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteAdminStatusChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/AdminNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:

  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 内部服务令牌。仅同步作业持有，客户端与前端**不得**持有该密钥。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        客户端会话令牌：43 字符 Base64URL 不透明串，**不得解析其内容**。
        只放 `Authorization` 头（`Bearer <token>`），不放在 URL 查询串里——
        查询串会进访问日志与浏览器历史。服务端只存其 SHA-256，30 天固定有效期。
        收到 401 时客户端应清本地会话并回到登录页，不要重试。

    consoleAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        站主后台会话令牌（43 字符 Base64URL 不透明串，服务端只存 SHA-256）。
        **12 小时固定有效期、不滑动续期**：管理权限不该「用着用着一直有效」。

        与客户端 `bearerAuth` 是两套独立凭据：站主令牌调不了 `/api/**`，
        客户端令牌也进不了 `/api/console/**`。

  parameters:
    WorkId:
      name: work_id
      in: path
      required: true
      description: 平台内部标识，由 Java 生成，客户端只当不透明字符串使用
      schema: { type: string }

    AdminId:
      name: admin_id
      in: path
      required: true
      description: 站主对外标识（`G-` 前缀），不暴露自增主键
      schema: { type: string, maxLength: 32 }

    UserId:
      name: user_id
      in: path
      required: true
      description: 客户端账号的对外标识（`U-` 前缀），不是自增主键
      schema: { type: string }

  responses:
    BadRequest:
      description: 请求格式或参数不合法（不重试，修正后重发）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 内部令牌缺失或无效（不重试）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnauthorizedSession:
      description: |
        会话令牌缺失、无效、已退出或已过期（`UNAUTHORIZED`）。
        客户端应静默清除本地会话并回到登录页，**不要**提示服务端错误、不要重试。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictCollection:
      description: |
        该作品当前不在收藏中（`COLLECTION_REQUIRED`），通常是另一端已经取消收藏。
        客户端应提示「收藏已失效，请刷新」，重新拉单条状态后重绘；**不得**自动重新提交。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictUsername:
      description: 用户名已被占用（`USERNAME_TAKEN`）。大小写不敏感，`Alice` 与 `alice` 视为同名
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DeviceLimitExceeded:
      description: |
        登记的推送设备数已达每账号上限（`DEVICE_LIMIT_EXCEEDED`）。
        客户端应提示用户先解绑旧设备，而不是反复重试。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 作品或批次不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SiteNotFound:
      description: 站点不存在（`SITE_NOT_FOUND`）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AdminNotFound:
      description: 站主不存在（`ADMIN_NOT_FOUND`）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BatchTooLarge:
      description: 单批条数超过 500（Python 拆批后重发）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 限流（重试，带退避）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimitedWithRetry:
      description: |
        触发限流（`RATE_LIMITED`）。两种来源，都用同一个头：
        - **登录失败次数超限**：`Retry-After` ≤ 900；
        - **发言太快**（评论/回复每 60 秒 5 条）：`Retry-After` ≤ 60，是窗口里最早那条到期的时间。

        客户端应按该值退避后再试，**不要**立刻重试、也不要展示成"账号被锁"。
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema: { type: integer, example: 900 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 服务端错误（重试，带退避）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    Forbidden:
      description: |
        登录态有效但无权做这件事（`FORBIDDEN`）。

        两种来源：目标资源属于**别的站点**（含 `site_key` 为空的历史账号），
        或站主账号／站点已被平台停用。契约要求 403 而不是 404——
        「我没权限」和「没这个用户」在站主那边是两件该做不同处理的事。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UserNotFound:
      description: 用户不存在（`USER_NOT_FOUND`）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    AppConfig:
      type: object
      required: [version, values]
      properties:
        version:
          type: integer
          format: int64
          description: 配置版本（毫秒时间戳）；0 = 库表从未写入
        values:
          type: object
          additionalProperties: true
          description: 键值袋，已知键见 GET /api/app/config 的说明

    AppConfigUpdate:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
          example: app.notice
        value:
          nullable: true
          description: 任意 JSON；标量 / 数组 / 对象都可以
        note:
          type: string
          nullable: true
          description: 写进库给人看的说明；留空保留原有 note

    AppConfigUpdateResult:
      type: object
      required: [version, key, value]
      properties:
        version: { type: integer, format: int64 }
        key: { type: string }
        value: { nullable: true }
        rebuild:
          allOf:
            - $ref: "#/components/schemas/AdultRebuildResult"
          nullable: true
          description: 只有改 adult.* 时才有

    AdultRebuildResult:
      type: object
      required: [enabled, hidden_works, tag_rows, millis]
      properties:
        enabled:
          type: boolean
          description: 本次重算时遮挡是否开着；false 表示全库已清零
        hidden_works:
          type: integer
          format: int64
          description: 重算后仍被隐藏的作品数
        tag_rows:
          type: integer
          description: work_tag 里实际改动的行数
        millis:
          type: integer
          format: int64
          description: 本次重算耗时（毫秒）


    Paging:
      type: object
      required: [page, page_size, total, total_pages, items]
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total:
          type: integer
          description: 符合条件的总数。客户端靠它判断是否末页，必须返回
          example: 7894
        total_pages: { type: integer, example: 395 }
        items:
          type: array
          items: {}

    WorkPaging:
      description: |
        作品列表的分页信封：`Paging` 的形状 + 一个 `hidden`。

        **为什么不直接给 `Paging` 加字段**：那是资讯 / 收藏 / 评论 / 后台共用的信封，
        加一个字段会让那些接口的 schema 全被要求带上它（契约漂移测试会当场报错）。
        而「被过滤掉了多少」只有作品列表有这个概念。
      allOf:
        - $ref: "#/components/schemas/Paging"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/WorkSummary" }
            hidden:
              type: integer
              description: |
                **因为成人内容遮挡、在当前筛选条件下被隐藏的条数。**

                用户改了类型 / 标签 / 年份 / 关键词，这个数字跟着变——它是
                「你眼前这个列表藏了几条」，不是全库成人总数。客户端据此显示
                「已隐藏 N 部成人内容」，让用户明白「数据不全」是主动过滤，
                不是抓取失败（铁律 3 的对外说法）。

                别的分页接口**不返回这个字段**（序列化时整个消失）。
                别把缺失当 0：0 的语义是「确实一条都没藏」。
              example: 3

    SourceRating:
      type: object
      nullable: true
      description: |
        来源评分。`null` 表示来源没有评分，**不是 0 分**，客户端必须不显示评分区域，
        不得显示 `0.0`。
      required: [value, scale, source]
      properties:
        value:
          type: number
          example: 7.8
        scale:
          type: string
          enum: ["0-10"]
          description: |
            评分尺度。**只接受 `0-10`**，其它取值该条 `rejected`（`RATING_OUT_OF_SCALE`）——
            来源若使用别的尺度，由适配器换算后再提交，不能原样入库。
            原因：排序与过滤只比较 `value`，不比较尺度；混入 0-100 会让排行榜与 `min_rating` 静默错位。
        source:
          type: string
          example: otaku_site

    TagList:
      type: object
      required: [total, items]
      properties:
        type:
          type: string
          nullable: true
          enum: [anime, comic, game, novel]
          description: 请求里带的 `type` 原样回显；省略时为 `null`（全部类型）
        total:
          type: integer
          description: |
            **本次返回的条数**，不是词表总数（与首站语义一致）。
            有 `limit` 时等于 `items` 的长度，不代表库里一共有多少个标签。
        items:
          type: array
          items: { $ref: "#/components/schemas/TagItem" }

    TagItem:
      type: object
      required: [name, count]
      properties:
        name: { type: string, example: 科幻 }
        count:
          type: integer
          minimum: 1
          description: 该标签下的作品数（当前快照；来源未提供标签的作品不计入）

    WorkSummary:
      type: object
      description: |
        列表项。**8 个字段，不含 `summary`**——简介最长 7225 字，列表带上会把响应撑爆，
        客户端需要简介时按 `work_id` 拉详情。
      required: [work_id, work_type, title]
      properties:
        work_id: { type: string, example: "W-8f3a91" }
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title: { type: string, example: 街角魔族 2丁目 }
        release_year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: |
            来源站年份原值。**`null` = 来源未提供，不是 0 年**；客户端为 `null` 时不渲染年份。
            来源站实测非空率约 95.9%（2026-10-22 抽样），个别作品仍会缺。
          example: 2022
        cover_url:
          type: string
          nullable: true
          description: |
            平台后端代理 + 本地缓存地址（Java 首次回源后缓存，之后由平台服务；客户端不直连来源站）。
            `null` 表示无封面，客户端显示占位图。
          example: https://api.example.com/covers/W-8f3a91
        tags:
          type: array
          nullable: true
          description: |
            `null` = 来源未提供；`[]` = 明确无标签（客户端不渲染标签区）。
            来源侧每条最多 5 个（站方截断），不宜作为主要筛选维度。
          items: { type: string }
          example: ["日常", "搞笑"]
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        source:
          type: string
          nullable: true
          description: |
            记录所属来源站的标识，取值域与 `Work.source` 一致（如 `otaku_site` / `bangumi`）。
            2026-10-24 补入（第 8 个字段）：列表 SQL 原本就 select 了 `source`，只是没往列表 DTO 透出。

            **用途只有一个：可辨识。** 同一标题出现两条记录时，客户端靠它标出来源，
            避免用户把两部不同作品当成同一部（实测 13,261 组跨源同名）。
            按「齐平原则」（见站点特色功能适配方案 §8）它是**透明度底线**——
            目录里只要存在非本站的记录，用户就必须能分辨；**它不是归并的前奏**，
            也不意味着不同来源的记录被认定是同一部作品。
            `null` = 来源未标注，客户端此时不渲染来源标识。
          example: bangumi

    RelatedWorks:
      type: object
      description: |
        详情页「相关内容推荐」。
        `basis_tags` 是本次实际参与匹配的标签（最多 5 个）；它为空时 `items` 必为空。
      required: [basis_tags, items]
      properties:
        basis_tags:
          type: array
          description: 用于匹配的标签；为空表示该作品没有标签，无法推荐
          items: { type: string }
          example: ["科幻", "机战"]
        items:
          type: array
          description: 相关作品，评分高 → 低，不含当前作品
          items: { $ref: "#/components/schemas/WorkSummary" }

    Work:
      type: object
      description: |
        详情。**全部 20 个字段**（含本阶段新增的可空 `source_url` 与 `release_year`，
        2026-10-28 扩入的 4 个富字段 `title_original` / `aliases` / `media` / `episodes`，
        以及 3 个关联数组 `staff` / `characters` / `studios`）。
        列表项是 7 字段（含 `release_year`），不含
        `summary` / `source` / `source_id` / `source_url` / `updated_at`、4 个富字段与 3 个关联数组。
      required: [work_id, work_type, title, source, source_id, updated_at]
      properties:
        work_id:
          type: string
          description: 平台内部标识，不透明，客户端所有业务只认它
          example: "W-8f3a91"
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title: { type: string, example: 街角魔族 2丁目 }
        summary:
          type: string
          nullable: true
          description: |
            换行已统一为 `\n`，**不截断**（最长 7225 字），折叠由客户端处理。
            `null` 表示来源没有简介，客户端显示"暂无简介"。
        release_year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: |
            来源站年份原值。`null` = 来源未提供，不是 0 年。
            与 `main_rating` 一样，可空字段**以 `null` 出现而不是被省略**。
          example: 1995
        title_original:
          type: string
          nullable: true
          description: |
            原名（来源语言的原文标题）。`null` = 来源没有，**不要用 `title` 回填**——
            两者相同时来源本就会给同一个值，回填只会让「有没有原名」这件事失去信号。
            实测非空率 81.3%（2026-10-28，首站 18,828 条）。
          example: 新世紀エヴァンゲリオン
        aliases:
          type: array
          nullable: true
          items: { type: string }
          description: |
            别名 / 译名列表。**三态**与 `tags` 一致：`null` = 来源未提供（不覆盖已有值）；
            `[]` = 明确没有别名；非空数组 = 有别名。
            实测 18,828 部里 **12,134 部（64.5%）有真实别名**；另有 6,694 部源列非空、
            内容却是空壳 `{\n}`（= 明确没有别名），按三态落 `[]`（2026-10-29）。
            早期记的「99.5%」是把空壳当成了数据，已作废。
          example: ["新世纪天鹰战士", "EVA"]
        media:
          type: string
          nullable: true
          description: |
            媒介形态，**来源原值原样返回**：`TV` / `剧场版` / `OVA` / `Web` / `游戏` / `漫画` / `小说` 等，
            中英混杂。平台**不做跨源枚举归一**——各站词表不同，强行归一等于替来源定义它自己的分类；
            客户端需要图标/文案时自行映射，不认识的值按原样显示，不得丢弃。
            实测非空率 93.4%（2026-10-28）。
          example: TV
        episodes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
          description: |
            话数 / 集数。`null` = 来源未提供（**不是 0 话**，也不代表「完结」）。
            实测非空率 61.6%，取值范围 1–1960（2026-10-28）。
          example: 26
        cover_url: { type: string, nullable: true, description: 平台后端代理+缓存地址（同列表项）；null 表示无封面 }
        tags:
          type: array
          nullable: true
          items: { type: string }
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        staff:
          type: array
          nullable: true
          description: |
            制作人员（导演 / 脚本 / 音乐 / 作画监督 …），按来源侧排序值升序。

            **三态**：`null` = 该来源通道未提供（例如只走 REST 的作品），
            `[]` = 明确没有，非空数组 = 有。客户端展示上可以把前两者都显示「暂无」，
            但**不要**据此判断数据完整性——47.5% 的作品有 Staff 是数据事实，不是缺陷。

            实测（2026-10-28，首站 18,828 部）：8,945 部有数据，共 183,356 条，平均 20.5 条/部。
            只收观众关心的职位；原画这类工序流水（16.6 万条）**不入库**，白名单见
            `rich-fields-tier-b-plan.md` §3。
          items: { $ref: "#/components/schemas/WorkStaff" }
        characters:
          type: array
          nullable: true
          description: |
            角色与声优，按来源侧排序值升序。三态语义同 `staff`。

            实测：8,015 部（42.6%）有数据，共 75,742 条，平均 9.5 条/部。
            声优名是来源原值文本，不做跨源归一。
          items: { $ref: "#/components/schemas/WorkCharacter" }
        studios:
          type: array
          nullable: true
          description: |
            制作公司名称列表（来源原值，不做归一、不做别名合并）。三态语义同 `staff`。
            实测覆盖 3,644 部（19.4%）。
          items: { type: string, maxLength: 200 }
          example: ["J.C.STAFF"]
        source:
          type: string
          description: 接入方唯一标识。已知取值 otaku_site（站点 API）、bangumi（Bangumi 档案）
          example: otaku_site
        source_id:
          type: string
          description: |
            来源站内作品 ID，字符串存储。可返回给客户端做溯源展示，
            但**客户端不得用它做业务判断**（跨站可能重复）。
          example: "476"
        source_url:
          type: string
          nullable: true
          description: |
            来源站的**人读原页**地址（不是 API 地址），由来源适配器在入库时提供，平台原样返回。

            - `null` 表示适配器无法可靠确定原页，客户端**不要**自己拼接、不要猜；
            - 客户端只用于「打开原页」这类导航，**不得**用它抓取数据；
            - 只允许打开可信的 HTTP/HTTPS 地址，其它协议的数据在入库时已被丢弃；
            - 缺失不影响作品的其他功能。
          example: "http://154.8.194.198:8000/contents/476"
        updated_at:
          type: string
          format: date-time
          description: 该记录最后一次变更时间，由 Java 维护，RFC 3339
        deleted:
          type: boolean
          description: |
            是否已下架（软删，2026-10-29 增）。`false` = 正常。

            源站删掉的作品**不物理删**：收藏、历史、外部引用都还指着它。下架后：

            - 列表 / 搜索 / 标签筛选 / 年份筛选**完全不返回**它；
            - 详情仍返回 `200`，本字段为 `true`——客户端应显示「已下架」占位，
              **不要**当成 404 处理，否则用户会以为自己的收藏丢了；
            - 已下架的作品不再提供阅读/收藏等操作入口；再次被同步到会自动复活（本字段转回 `false`）。

    WorkStaff:
      type: object
      description: |
        一条制作人员记录。`role` 是来源原值，平台不做职位归一
        （「总作画监督」不会合并成「作画监督」）——合并会丢掉信息，由客户端决定怎么展示。
      required: [role, name]
      properties:
        role:
          type: string
          maxLength: 64
          description: 职位（导演 / 脚本 / 音乐 / 作画监督 …），来源原值
          example: 脚本
        name:
          type: string
          maxLength: 200
          description: 人名，来源原值
          example: 伊藤和典
        person_id:
          type: string
          nullable: true
          description: |
            人物实体标识。`null` = 该条来自纯文本解析、没有实体（实测 Staff 侧 **0%** 有值）。

            **人物页落地前一律 null**，客户端不得依赖它做跳转，也不得因它为 null 就隐藏该条记录。
            字段先占位是为了让客户端提前布局，不是「马上就会填满」的承诺。

    WorkCharacter:
      type: object
      description: |
        一条角色与声优记录。角色名与声优名都是来源原值文本。
      required: [name, actor]
      properties:
        name:
          type: string
          maxLength: 200
          description: 角色名
          example: 艾妲拉姆·葛蘭特
        actor:
          type: string
          maxLength: 200
          description: 声优名（来源原值，含日文原文）
          example: 長谷川育美
        character_type:
          type: string
          nullable: true
          maxLength: 16
          description: |
            角色类型原值：主角 / 配角 / 客串 / 闲角 / 旁白。
            实测 **84% 为空**（来源没有区分主角配角），`null` 是常态而不是异常——客户端不要显示「未知类型」。
          example: 配角
        person_id:
          type: string
          nullable: true
          description: |
            声优的人物实体标识。与 `WorkStaff.person_id` 不同，这一侧实测 **100% 有值**，
            但人物页端点落地前客户端仍不得跳转。

    DeletionRequest:
      type: object
      description: |
        软删请求。`source` + `items[].source_id` 与接口②的唯一键同源，直接对应 `work` 行。
      required: [source, batch_id, items]
      properties:
        source:
          type: string
          maxLength: 64
          description: 来源标识；只影响这个来源的行
          example: bangumi
        batch_id:
          type: string
          maxLength: 128
          description: 批次标识，供重放与排障，与接口②同名同义
          example: del-2026-10-29
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [source_id]
            properties:
              source_id:
                type: string
                maxLength: 128
                example: "265"
              reason:
                type: string
                nullable: true
                description: 删除原因，**只入日志不入库**（没有查询方，不占业务表列）
                example: absent_from_snapshot

    DeletionResult:
      type: object
      description: |
        软删结果。三个计数分开是为了对账：`accepted` 是这次真删的，`already_deleted`
        是重发命中，`unknown` 是键对不上（数据集与后端 id 体系错位时会突然变大）。
      required: [batch_id, accepted, already_deleted, unknown]
      properties:
        batch_id:
          type: string
          example: del-2026-10-29
        accepted:
          type: integer
          description: 本次真正标记为下架的行数
          example: 12
        already_deleted:
          type: integer
          description: 之前就已经软删的行数（重发是常态，不算错）
          example: 3
        unknown:
          type: integer
          description: |
            库里没有这个 `(source, source_id)` 的数量：从没导过、或早已被清理。
            **不算错、不整批失败**，但持续变大说明两端 id 体系对歪了。
          example: 1
        deleted_at:
          type: string
          format: date-time
          description: 本次操作使用的下架时间（UTC，RFC 3339）；已软删的行保留首次下架时间，不会被刷新
          example: "2026-10-29T04:30:00Z"

    UgcComment:
      type: object
      description: |
        一条作品评论**或回复**。字段刻意少：作者 id、站点键、状态机都是内部实现，
        暴露出去只会让客户端跟着我们改名。

        B2c 起一条评论可能是回复（`parent_id` 非空）。回复**只有一层**：`parent_id`
        永远指向顶层评论，不会出现「回复的回复」——所以客户端不需要递归渲染。

        三个新字段的取值规则：
        - 顶层评论：`parent_id = null`，`reply_count` 是已发布回复总数，`replies` 是前 3 条预览；
        - 回复：`parent_id` 指向顶层评论，`reply_count = null`，`replies = []`。
      required: [comment_id, work_id, author, body, status, created_at]
      properties:
        comment_id:
          type: string
          example: "1024"
        work_id:
          type: string
          example: "W-8f3a91"
        author:
          type: string
          description: 用户名（B1 没有昵称体系）
          example: "kagamimi"
        body:
          type: string
          maxLength: 1000
          description: |
            纯文本，客户端**不得**按 HTML/Markdown 渲染。
            长度按 **Unicode 码点**计（一个 emoji 算 1 个，不是 UTF-16 的 2 个），与数据库列一致。
          example: "第三集的作画真是顶。"
        status:
          type: string
          enum: [published, pending, hidden, deleted]
          description: |
            评论状态。公开列表里只会是 `published`；发评论的响应可能是 `pending`
            （站点开了「先审后发」），客户端应提示「提交成功，审核后显示」。
          example: published
        created_at:
          type: string
          format: date-time
          description: 发表时间（UTC，RFC 3339）
          example: "2026-10-29T05:10:00Z"
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: |
            作者最后一次修改正文的时间；`null` = 从未编辑。

            站主的隐藏 / 恢复**不算**编辑——那些只动内部 `updated_at`，不对外暴露，
            否则「已编辑」会变成审核动作的副作用。
          example: "2026-10-29T06:20:00Z"
        parent_id:
          type: string
          nullable: true
          description: 回复的目标顶层评论 id；顶层评论为 `null`
          example: "1024"
        reply_count:
          type: integer
          nullable: true
          minimum: 0
          description: |
            该顶层评论下**已发布**的回复总数（不含待审/已隐藏/已删）。
            只有顶层评论有值；回复为 `null`。
          example: 3
        replies:
          type: array
          description: |
            内嵌的回复预览：**最早在前**，最多 3 条。只有顶层评论有值；回复为 `[]`。
            完整回复走 `GET /api/works/{work_id}/comments/{comment_id}/replies`。
          items: { $ref: "#/components/schemas/UgcComment" }

    UgcReview:
      type: object
      description: |
        一条作品点评。`rating` 与 `body` 至少一项非空：
        只打分、只写评都行，两样都空不叫点评（服务端 `400`）。
      required: [review_id, work_id, author, status, created_at]
      properties:
        review_id:
          type: string
          example: "88"
        work_id:
          type: string
          example: "W-8f3a91"
        author:
          type: string
          description: 用户名；已注销用户显示「已注销用户」
          example: "kagamimi"
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: 1–10；`null` = 只写了文字没打分（不参与均分）
          example: 8
        body:
          type: string
          nullable: true
          maxLength: 5000
          description: |
            纯文本长评，客户端**不得**按 HTML/Markdown 渲染；`null` = 只打分。
            长度按 **Unicode 码点**计（emoji 算 1 个），与数据库列一致。
          example: "作画稳定，节奏比第一季更松弛。"
        status:
          type: string
          enum: [published, pending, hidden, deleted]
          description: 公开列表里只会是 `published`；新发可能是 `pending`（先审后发）
          example: published
        created_at:
          type: string
          format: date-time
          example: "2026-10-30T07:10:00Z"
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: 作者最后一次修改内容的时间；`null` = 未编辑
          example: "2026-10-30T08:00:00Z"

    UgcReviewPage:
      type: object
      description: 点评分页信封，字段与其它列表一致。
      required: [total, page, page_size, total_pages, items]
      properties:
        total: { type: integer, example: 12 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total_pages: { type: integer, example: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/UgcReview" }

    UgcReviewSummary:
      type: object
      description: |
        评分概览。三个数字口径不同：`total` 含只写文字的；
        `rated` 只算打了分的；`average` 只对打了分的求均值（可为 null）。
      required: [total, rated, distribution]
      properties:
        total:
          type: integer
          description: 已发布点评总条数（含只写文字不打分的）
          example: 12
        rated:
          type: integer
          description: 其中打了分的条数
          example: 9
        average:
          type: number
          format: double
          nullable: true
          description: 打了分的那部分的均分；一条都没打分时为 null
          example: 7.8
        distribution:
          type: array
          description: 各分数的条数，没有的分数不出现（不补 0）
          items: { $ref: "#/components/schemas/RatingBucket" }

    RatingBucket:
      type: object
      required: [rating, count]
      properties:
        rating: { type: integer, minimum: 1, maximum: 10, example: 8 }
        count: { type: integer, minimum: 1, example: 4 }

    UgcReviewRequest:
      type: object
      required: [work_id]
      properties:
        work_id:
          type: string
          example: "W-8f3a91"
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: 评分；与 `body` 至少一项非空
          example: 8
        body:
          type: string
          nullable: true
          maxLength: 5000
          description: 纯文本长评；与 `rating` 至少一项非空。空白归一成 null
          example: "作画稳定，节奏比第一季更松弛。"

    UgcReviewEditRequest:
      type: object
      description: |
        省略的字段沿用原值——只改评分时正文不会被清空。合并后至少要有一项非空。
      properties:
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          example: 9
        body:
          type: string
          nullable: true
          maxLength: 5000
          example: "二刷之后改到 9 分。"

    UgcCommentPage:
      type: object
      description: 评论分页信封，字段与作品列表一致（`total` / `page` / `page_size` / `total_pages` / `items`）。
      required: [total, page, page_size, total_pages, items]
      properties:
        total: { type: integer, example: 3 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total_pages: { type: integer, example: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/UgcComment" }

    UgcCommentRequest:
      type: object
      required: [work_id, body]
      properties:
        work_id:
          type: string
          description: 要评论的作品
          example: "W-8f3a91"
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: 纯文本；去首尾空白后为空 → 400
          example: "第三集的作画真是顶。"
        parent_id:
          type: string
          nullable: true
          description: |
            要回复的顶层评论 id。省略或 `null` = 发顶层评论。

            校验：父评论必须在本作品下、状态为 `published`；指向一条回复 → **400**
            （只支持一层）；不存在 / 跨作品 / 待审 / 已隐藏 / 已删 → **404**，不泄露状态。
          example: "1024"

    UgcCommentEditRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            新的正文，纯文本。去首尾空白后为空 → `400`；超 1000 字 → `400`（不截断）。

            只有正文可改：作品、作者、父评论都不接受——要把回复换个位置说，删了重发。
          example: "第三集的作画真是顶（改：第 3 集）。"

    SiteFeatures:
      type: object
      required: [ugc_enabled, ugc_moderation]
      properties:
        ugc_enabled:
          type: boolean
          description: 本站是否开启社区（作品评论）。`false` 时客户端跳来源站原页补位
          example: false
        ugc_moderation:
          type: string
          enum: [post, pre]
          description: |
            发布策略。`post` = 先发后审（评论立刻可见）；`pre` = 先审后发
            （新评论 `pending`，客户端提示「审核后显示」）。
          example: post

    ConsoleUgcItem:
      type: object
      required: [comment_id, work_id, work_title, author, body, status, created_at]
      properties:
        comment_id: { type: string, example: "1024" }
        work_id: { type: string, example: "W-8f3a91" }
        work_title:
          type: string
          description: 作品标题（用于审核时判断上下文）；作品已不存在时回落成 work_id
          example: "骇客娃娃"
        author: { type: string, example: "kagamimi" }
        body: { type: string, example: "第三集的作画真是顶。" }
        status:
          type: string
          enum: [published, hidden, deleted]
        created_at: { type: string, format: date-time, example: "2026-10-29T05:10:00Z" }

    ConsoleUgcPage:
      type: object
      required: [total, page, page_size, total_pages, items]
      properties:
        total: { type: integer, example: 12 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total_pages: { type: integer, example: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ConsoleUgcItem" }

    SiteUgcSetting:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 本站社区开关。默认 `false`（合规责任在网站，开不开由站主决定）
          example: true
        moderation:
          type: string
          enum: [post, pre]
          description: 发布策略，含义同 `SiteFeatures.ugc_moderation`
          example: post

    SiteUgcSettingUpdate:
      type: object
      description: |
        `enabled` 与 `moderation` 至少给一个：都不给等于「没说要改什么」，返回 400。
      properties:
        enabled:
          type: boolean
          description: 可省略；给了才改
        moderation:
          type: string
          enum: [post, pre]
          description: 可省略；给了才改（post 先发后审 / pre 先审后发）

    CommentReportRequest:
      type: object
      required: [comment_id, reason]
      properties:
        comment_id: { type: string, example: "1024" }
        reason:
          type: string
          maxLength: 200
          description: 纯文本，1–200 字；只给站主/平台看，不对外展示
          example: "人身攻击"

    CommentReport:
      type: object
      required: [report_id, comment_id, status]
      properties:
        report_id: { type: string, example: "7" }
        comment_id: { type: string, example: "1024" }
        status:
          type: string
          enum: [open, resolved, dismissed]
          example: open

    ConsoleReportItem:
      type: object
      required: [report_id, comment_id, work_id, work_title, author, body, reason, status, created_at]
      properties:
        report_id: { type: string, example: "7" }
        comment_id: { type: string, example: "1024" }
        work_id: { type: string, example: "W-8f3a91" }
        work_title: { type: string, example: "骇客娃娃" }
        author: { type: string, description: 被举报评论的作者, example: "kagamimi" }
        body: { type: string, description: 被举报评论的正文, example: "..." }
        reason: { type: string, description: 举报理由, example: "人身攻击" }
        status:
          type: string
          enum: [open, resolved, dismissed]
        created_at: { type: string, format: date-time }

    ConsoleReportPage:
      type: object
      required: [total, page, page_size, total_pages, items]
      properties:
        total: { type: integer, example: 3 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total_pages: { type: integer, example: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ConsoleReportItem" }

    SchedulePage:
      type: object
      description: |
        一页档期。按星期分组返回而不是平铺列表：客户端「每日新番」页就是周一…周日分组布局，
        服务端分组可少传 7 次星期字段，客户端也少一层 groupBy。
      required: [season, seasons, groups]
      properties:
        season:
          type: string
          nullable: true
          description: 本次返回的季度；库里没有任何档期时为 null
          pattern: "^[0-9]{6}$"
          example: "202504"
        seasons:
          type: array
          description: 全部可用季度（新的在前），给「切换季度」下拉用；无数据时为空数组
          items: { type: string, pattern: "^[0-9]{6}$" }
        groups:
          type: array
          description: 按星期分组的档期，固定 8 组（周一…周日 + 待定）；空季度时组内为空
          items: { $ref: "#/components/schemas/ScheduleGroup" }

    ScheduleGroup:
      type: object
      required: [weekday, label, items]
      properties:
        weekday:
          type: integer
          nullable: true
          description: 星期几（1=周一 … 7=周日）；null = 待定组，排在最后
          minimum: 1
          maximum: 7
          example: 2
        label:
          type: string
          description: 分组标签，如「周二」
          example: 周二
        items:
          type: array
          description: 该星期的档期条目
          items: { $ref: "#/components/schemas/ScheduleItem" }

    ScheduleItem:
      type: object
      description: 一条档期。
      required: [schedule_id, season_code]
      properties:
        schedule_id:
          type: string
          description: 档期记录主键（来源站侧），不透明
          example: "sch-202504-12345"
        season_code: { type: string, pattern: "^[0-9]{6}$", example: "202504" }
        title_main: { type: string, description: 主标题（来源站语言）, example: 葬送的芙莉莲 }
        title_cn: { type: string, nullable: true, description: 中文译名；无则 null }
        title_jp: { type: string, nullable: true, description: 日文原名；无则 null }
        weekday:
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
          description: 播出星期（1=周一…7=周日）；null=待定
        broadcast_time:
          type: string
          nullable: true
          description: 播出时间（来源站原格式，如「23:30」）；无则 null
        broadcast_note:
          type: string
          nullable: true
          description: 播出备注（如「每周五 深夜」）；无则 null
        work_type:
          type: string
          nullable: true
          enum: [anime, comic, game, novel]
          description: 类型；来源未给则 null
        work_tags:
          type: array
          nullable: true
          description: 标签；null=来源未提供
          items: { type: string }
          example: ["奇幻", "冒险"]
        image_url:
          type: string
          nullable: true
          description: 封面图地址（来源站原图）；无则 null，客户端显示占位图
        platforms:
          type: array
          nullable: true
          description: 播放平台列表；无则 null
          items: { $ref: "#/components/schemas/SchedulePlatform" }
        source_url:
          type: string
          nullable: true
          description: 来源站人读原页；null 时不渲染回流入口（同契约 source_url 规则）
        work_id:
          type: string
          nullable: true
          description: 命中本地作品时为其 work_id，客户端据此跳转本地详情；null 时只展示、不给死链

    SchedulePlatform:
      type: object
      required: [name, url]
      properties:
        name: { type: string, example: bilibili }
        url: { type: string, format: uri, example: "https://www.bilibili.com/bangumi" }

    ScheduleImportRequest:
      type: object
      required: [batch_id, source, items]
      properties:
        batch_id:
          type: string
          maxLength: 128
          description: 幂等键，格式与 ImportBatchRequest 一致（`{source}-schedule-{日期}-{内容指纹}`）
          example: bangumi-schedule-20261022-9c1f3a
        source:
          type: string
          enum: [otaku_site, bangumi]
          description: 接入方唯一标识；档期侧目前由同步器按来源填充
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 本次拉取时间，仅作排查参考
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ScheduleImportItem" }

    ScheduleImportItem:
      type: object
      description: 档期提交项。字段命名与站点 GET /api/schedule 对齐（snake_case）。
      required: [source_id, season_code, title_main]
      properties:
        source_id: { type: string, minLength: 1, description: 来源站档期 ID }
        season_code: { type: string, pattern: "^[0-9]{6}$", example: "202504" }
        title_main: { type: string, minLength: 1, maxLength: 500, description: 主标题 }
        title_cn: { type: string, nullable: true, maxLength: 500 }
        title_jp: { type: string, nullable: true, maxLength: 500 }
        weekday: { type: integer, nullable: true, minimum: 1, maximum: 7 }
        broadcast_time: { type: string, nullable: true }
        broadcast_note: { type: string, nullable: true }
        work_type: { type: string, nullable: true, enum: [anime, comic, game, novel] }
        work_tags:
          type: array
          nullable: true
          description: 站点给斜杠字符串（如「奇幻/冒险」），同步侧拆成数组后提交；null=未提供
          items: { type: string }
        image_url: { type: string, nullable: true, description: 封面图地址；空串在同步侧转 null }
        platforms:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/SchedulePlatform" }
        source_url:
          type: string
          nullable: true
          maxLength: 1024
          description: 来源站人读原页；只接受 http/https
        content_id:
          type: string
          nullable: true
          description: 原样透传的来源站内容 ID；关联本地作品由后端按 (source, source_id) 尽力匹配
        source_updated_at:
          type: string
          format: date-time
          nullable: true
          description: 来源侧该条目的更新时间；用于增量判断

    ImportBatchRequest:
      type: object
      required: [batch_id, source, items]
      properties:
        batch_id:
          type: string
          maxLength: 128
          description: |
            幂等键，格式 `{source}-{类型}-{日期}-{内容指纹}`，
            指纹为排序后 source_id 集合的哈希。同一批输入重跑必须得到同一个 batch_id。
          example: otaku_site-anime-20261020-3a9f1c
        source:
          type: string
          description: |
            接入方唯一标识（见契约第 4.6 节）。已知取值：otaku_site（现有站点 API）、
            bangumi（Bangumi 官方数据集档案，见 sync-python 适配器）。后端按字符串存储、
            不做白名单校验，新增来源按约定加适配器和 source 取值即可。
          enum: [otaku_site, bangumi]
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 本次拉取时间，仅作排查参考，不参与业务判断
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ImportItem" }

    ImportItem:
      type: object
      description: |
        提交项 16 个字段。`work_id` 由 Java 生成、`updated_at` 由 Java 维护、`source` 在批次级，
        因此都不出现在条目里。

        `source_url` 与 `release_year` 都是**可选**字段：适配器能可靠确定时提供，
        确定不了就传 `null`（或不传），**不要猜**。平台原样入库，详情接口返回。

        2026-10-28 扩入 4 个富字段（`title_original` / `aliases` / `media` / `episodes`）：
        它们全部**可省略**，省略 = 保留库中原值（与 `release_year` 同一语义）；
        传 `null` 同样不清空已有值。这样旧版同步器不改也能继续工作。

        2026-10-28 再扩入 3 个关联数组（`staff` / `characters` / `studios`），同样是三态语义
        且可省略。**省略与 `null` 都不动库中已有数据**——这条是硬要求：REST 通道的作品
        拿不到这些字段，若把「没提供」当成「清空」，一次普通同步就会把数据集通道好不容易
        导进来的 Staff 全抹掉。

        数组是**整体替换**语义：非空数组 = 用这批值替换该作品的全部记录
        （不是追加，也不是按条 upsert）。重跑幂等，且能自然表达「Staff 减少了几个人」。
      required: [source_id, work_type, title]
      properties:
        source_id:
          type: string
          minLength: 1
          description: 来源站作品 ID。与批次级 source 共同构成唯一键
          example: "476"
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: 来源标题原文，不做跨类型转换、不做截断
        summary:
          type: string
          nullable: true
          description: 换行已统一为 \n；来源缺失传 null，不传空字符串
        cover_url:
          type: string
          nullable: true
          description: 已拼成绝对地址；空串在 Python 侧已转为 null
        release_year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: |
            年份原值，**可省略或传 `null`**（= 来源未提供）。省略时保留库中原值，不会清空。
            越界（如 0、1899、2101）整条拒收，错误码 `INVALID_RELEASE_YEAR`。
            允许省略是为了让旧版同步器不改也能继续工作。
          example: 2022
        tags:
          type: array
          nullable: true
          description: |
            `null` = 本次没拿到（不覆盖已有值）；`[]` = 明确无标签（清空）。
            两者语义不同，不要混用。
          items: { type: string }
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        source_url:
          type: string
          nullable: true
          maxLength: 1024
          description: |
            来源站**人读原页**地址（不是 `/api/...` 接口地址）。
            只接受 http/https；其它协议或超长值会被平台丢弃（不拒收整条，只把该字段置 null）。
          example: "http://154.8.194.198:8000/contents/476"
        title_original:
          type: string
          nullable: true
          maxLength: 500
          description: |
            原名。省略或 `null` = 本次没拿到（不覆盖已有值）。
          example: 新世紀エヴァンゲリオン
        aliases:
          type: array
          nullable: true
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: |
            别名列表。三态同 `tags`：省略/`null` = 本次没拿到（不覆盖）；`[]` = 明确没有别名（清空）。
          example: ["新世纪天鹰战士", "EVA"]
        media:
          type: string
          nullable: true
          maxLength: 64
          description: |
            媒介形态，**来源原值**（TV / 剧场版 / OVA / Web / 游戏 / 漫画 / 小说 …）。
            平台不做跨源枚举归一，也不做中文/英文转换。
          example: TV
        episodes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
          description: |
            话数。省略或 `null` = 本次没拿到（不覆盖已有值）。
            越界（0 或 > 10000）整条拒收，错误码 `INVALID_EPISODES`——不静默置 null，
            因为 `0 话` 与「未提供」在展示上含义完全不同。
          example: 26
        staff:
          type: array
          nullable: true
          description: |
            制作人员。**三态**：省略或 `null` = 本次没拿到（**不动库中已有记录**）；
            `[]` = 明确没有（清空）；非空数组 = 整体替换该作品的全部 Staff。

            批次级颗粒度是「作品」：一次提交里同一 `source_id` 的所有 Staff 都在这个数组里，
            不做增量追加——追加语义在来源侧删人时就永远删不掉。
          items: { $ref: "#/components/schemas/WorkStaff" }
        characters:
          type: array
          nullable: true
          description: 角色与声优。三态与整体替换语义同 `staff`。
          items: { $ref: "#/components/schemas/WorkCharacter" }
        studios:
          type: array
          nullable: true
          description: 制作公司名称列表。三态与整体替换语义同 `staff`。
          items: { type: string, maxLength: 200 }

    ImportBatchResult:
      type: object
      required: [batch_id, counts, errors]
      properties:
        batch_id: { type: string }
        counts:
          type: object
          required: [inserted, updated, unchanged, rejected]
          properties:
            inserted: { type: integer, example: 97 }
            updated: { type: integer, example: 3 }
            unchanged: { type: integer, example: 0 }
            rejected: { type: integer, example: 0 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        errors:
          type: array
          description: 只需失败明细与提示项，成功条目不必逐条回传
          items: { $ref: "#/components/schemas/ImportItemResult" }

    Counts:
      type: object
      description: 逐条结果的四类计数
      required: [inserted, updated, unchanged, rejected]
      properties:
        inserted: { type: integer, example: 97 }
        updated: { type: integer, example: 3 }
        unchanged: { type: integer, example: 0 }
        rejected: { type: integer, example: 0 }

    ImportBatchRun:
      type: object
      description: 一次导入运行的明细（`?with_runs=true` 才有）
      required: [run_seq, counts, started_at]
      properties:
        run_seq:
          type: integer
          description: 第几次运行，从 1 开始按上报顺序递增；同一 `batch_id + run_seq` 唯一
          example: 2
        counts: { $ref: "#/components/schemas/Counts" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ImportItemResult" }

    ImportBatchDetail:
      type: object
      description: |
        批次汇总 + 逐次运行明细。顶层 `counts` 是**最近一次**运行的快照（与 `import_batch` 一致），
        每一轮的计数在 `runs` 里，按 `run_seq` 升序。
      required: [batch_id, counts, errors, run_count, runs]
      properties:
        batch_id: { type: string }
        counts: { $ref: "#/components/schemas/Counts" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ImportItemResult" }
        run_count:
          type: integer
          description: 该 batch_id 被提交的总次数
          example: 2
        last_run_at:
          type: string
          format: date-time
          nullable: true
        runs:
          type: array
          items: { $ref: "#/components/schemas/ImportBatchRun" }

    ImportItemResult:
      type: object
      required: [source_id, result]
      properties:
        source_id: { type: string }
        result:
          type: string
          enum: [inserted, updated, unchanged, rejected]
        work_id:
          type: string
          nullable: true
          description: rejected 时为 null
        code:
          type: string
          nullable: true
          description: |
            逐条错误码，走本数组而不走统一错误信封——一条坏记录不该拖垮整批。
            `DUPLICATE_IN_BATCH` 只是提示（同批内 source_id 重复，最后一次生效），不算失败。
          enum:
            - TITLE_REQUIRED
            - INVALID_TYPE
            - RATING_OUT_OF_SCALE
            - DUPLICATE_IN_BATCH
            - INTERNAL_ERROR
        message:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      description: 统一错误信封，接口②③④共用（接口①是平台主动拉取，失败记适配器日志）
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - BAD_REQUEST
                - WORK_NOT_FOUND
                - USERNAME_TAKEN
                - COLLECTION_REQUIRED
                - BATCH_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
              description: 面向开发者的说明，不直接展示给终端用户
      example:
        error: { code: WORK_NOT_FOUND, message: 作品不存在 }

    # --- 阶段 2 ---------------------------------------------------------------

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          example: alice
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        device_label:
          type: string
          maxLength: 64
          nullable: true
          description: 客户端自报的设备标识，仅用于展示与排查，不参与鉴权
          example: android

    SiteLoginRequest:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
          minLength: 1
          description: |
            站点 `/oauth/authorize` 回跳带回的一次性票据（120 秒有效）。
            平台后端不落库、不打日志，用完即废。

    CreateAccountRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        site_key:
          type: string
          nullable: true
          description: |
            归属站点（Issue #144 站主后台的隔离依据）。必须已存在，未知站点返回 400。

            **不传 = 未归属站点**：账号能登录客户端，但任何站主后台都看不到、也禁不了。
            刻意不设默认值——猜一个默认站意味着 A 站能把 B 站的用户封掉。

    User:
      type: object
      required: [user_id, username]
      properties:
        user_id:
          type: string
          description: 平台生成的不透明标识，客户端**不得解析**
          example: U-9k2m0p7qz58f3a1
        username:
          type: string
          example: alice
        display_name:
          type: string
          nullable: true
          description: |
            平台账号恒为 `null`，客户端回落到 `username`。
            站点登录（`POST /api/auth/site-login`）的 200 响应里会带上站点昵称，
            仅供本次展示、不落库；同一账号后续 `/api/auth/me` 仍为 `null`。
        created_at:
          type: string
          format: date-time
          nullable: true

    SessionResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 会话令牌，只在此处返回一次；服务端只保存其哈希
          example: 9Zk3m0p7qz58f3a1k2m0p7qz58f3a1k2m0p7qz58f
        expires_at:
          type: string
          format: date-time
          description: 固定 30 天，不滑动续期；到期需重新登录
        user:
          $ref: "#/components/schemas/User"

    CollectionUpdateRequest:
      type: object
      description: 只接受「目标状态」，不提供 toggle——切换语义在网络重试时会反向操作
      properties:
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
          description: |
            `null` / 省略 = 已收藏但不设状态。取值非法返回 `400`，**不会**静默降级为 `null`。

    CollectionState:
      type: object
      required: [work_id, collected]
      description: |
        单条收藏状态。`collected: false` 表示未收藏（此时 `status` 与 `updated_at` 为 `null`），
        这是正常结果而不是错误——只有作品本身不存在才返回 404。
      properties:
        work_id:
          type: string
        collected:
          type: boolean
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
          description: "`null` 有两种含义：未收藏，或已收藏但未设状态——由 `collected` 区分"
        created_at:
          type: string
          format: date-time
          nullable: true
          description: 首次收藏时间；未收藏为 `null`
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 最后一次状态变更时间，用于对账与排查；未收藏为 `null`

    CollectionItem:
      type: object
      description: 收藏列表项。作品字段与作品列表同源，但**不含 `summary`、`tags` 与评分**
      required: [work_id, work_type, title, status, created_at, updated_at]
      properties:
        work_id:
          type: string
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title:
          type: string
        cover_url:
          type: string
          nullable: true
          description: 平台封面代理地址；`null` 时客户端不发请求，直接显示占位图
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionPage:
      allOf:
        - $ref: "#/components/schemas/Paging"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CollectionItem" }

    ArticlePage:
      allOf:
        - $ref: "#/components/schemas/Paging"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ArticleSummary" }

    ArticleSummary:
      type: object
      properties:
        article_id:
          type: string
          description: 资讯在平台内的稳定 id
        title: { type: string }
        summary: { type: string, nullable: true }
        category: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        source_name: { type: string, nullable: true }
        source_url:
          type: string
          nullable: true
          description: 原文链接（来源站人读页），客户端用它跳回来源站——G3「用户不被困在平台内」
        cover_url:
          type: string
          nullable: true
          description: 平台封面代理地址；`null` 时客户端不发请求，直接显示占位图
        tags:
          type: array
          items: { type: string }

    ArticleDetail:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          properties:
            body:
              type: string
              description: 正文，只在详情给，列表不带
            related_work_ids:
              type: array
              items: { type: string }
              description: 来源站「关联作品」的站点作品 id 原文，不回填本地 work_id

    ArticleCategory:
      type: object
      properties:
        name: { type: string }
        count: { type: integer, description: 该分类下的资讯条数 }

    ArticleImportRequest:
      type: object
      required: [batch_id, source, items]
      properties:
        batch_id:
          type: string
          maxLength: 128
          description: 幂等键，格式与 ImportBatchRequest 一致（`{source}-article-{日期}-{内容指纹}`）
          example: otaku_site-article-20261023-4b8e21
        source:
          type: string
          enum: [otaku_site]
          description: 接入方唯一标识；资讯侧目前仅 Otaku 站点一个来源
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 本次拉取时间，仅作排查参考
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ArticleImportItem" }

    ArticleImportItem:
      type: object
      required: [source_id, title]
      properties:
        source_id:
          type: string
          description: 资讯在来源站的 id，与 source 共同构成唯一键
        title: { type: string }
        summary: { type: string, nullable: true }
        body: { type: string, nullable: true }
        category: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        source_name: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        cover_url: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        related_work_ids:
          type: array
          items: { type: string }
          description: 来源站「关联作品」的站点作品 id 原文，透传不回填

    # -------------------------------------------------------------------------
    # 站主运营后台（Issue #144）
    # 字段一律 snake_case（服务端统一 SNAKE_CASE 策略）；时间均为 UTC，ISO-8601
    # -------------------------------------------------------------------------

    ConsoleLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 72, description: 明文只在传输层出现，服务端只存 BCrypt }
        device_label:
          type: string
          nullable: true
          maxLength: 64
          description: 仅用于会话列表与排查，可空

    ConsoleSite:
      type: object
      required: [site_key, display_name]
      properties:
        site_key: { type: string, example: demo-site }
        display_name: { type: string }

    ConsoleAdmin:
      type: object
      required: [admin_id, username, identity_source]
      properties:
        admin_id: { type: string, description: "`G-` 前缀，对外不透明" }
        username: { type: string }
        display_name: { type: string, nullable: true }
        identity_source:
          type: string
          enum: [platform, site_oauth]
          description: platform = 平台建号（过渡态）；site_oauth = 网站账号（#147 就绪后）

    ConsoleSession:
      type: object
      required: [token, expires_at, site, admin]
      properties:
        token: { type: string, description: 只在此处返回一次；客户端自行安全保存，不要放进 URL }
        expires_at: { type: string, format: date-time, description: 12 小时后固定过期，不滑动续期 }
        site: { $ref: "#/components/schemas/ConsoleSite" }
        admin: { $ref: "#/components/schemas/ConsoleAdmin" }

    ConsoleMe:
      type: object
      required: [site, admin]
      properties:
        site: { $ref: "#/components/schemas/ConsoleSite" }
        admin: { $ref: "#/components/schemas/ConsoleAdmin" }

    ConsoleTypeCount:
      type: object
      required: [work_type, count]
      properties:
        work_type: { type: string, enum: [anime, comic, game, novel] }
        count: { type: integer }

    ConsoleWorksStats:
      type: object
      required: [total, by_type]
      properties:
        total: { type: integer, description: 本站作品总数 }
        by_type:
          type: array
          items: { $ref: "#/components/schemas/ConsoleTypeCount" }

    ConsoleFieldCoverage:
      type: object
      required: [field, present, percent]
      properties:
        field:
          type: string
          description: |
            字段名（与 `scripts/data-coverage.sql` 口径一一对应）：
            title / summary / release_year / cover_source_url / cover_cached_at /
            rating_value / tags_provided / tags_nonempty / source_url
        present: { type: integer, description: 非空条数 }
        percent: { type: number, description: 保留一位小数的百分比（0–100） }

    ConsoleCoverage:
      type: object
      required: [total, fields]
      properties:
        total: { type: integer }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ConsoleFieldCoverage" }

    ConsoleSyncSummary:
      type: object
      required: [status, runs_last_7d, failed_runs_last_7d, rejected_last_7d]
      properties:
        status:
          type: string
          enum: [never, ok, partial, failed]
          description: |
            never = 从没跑过；failed = 最近一次没有收尾时间（被中断），**优先于 partial**；
            partial = 有拒收；ok = 正常
        last_run_at: { type: string, format: date-time, nullable: true }
        last_batch_id: { type: string, nullable: true }
        runs_last_7d: { type: integer }
        failed_runs_last_7d: { type: integer, description: 7 天内没有收尾时间的运行数 }
        rejected_last_7d: { type: integer }

    ConsoleOverview:
      type: object
      required: [site, sources, works, coverage, sync]
      properties:
        site: { $ref: "#/components/schemas/ConsoleSite" }
        sources:
          type: array
          items: { type: string }
          description: 本站绑定的数据来源标识；空数组表示还没配来源
        works: { $ref: "#/components/schemas/ConsoleWorksStats" }
        coverage: { $ref: "#/components/schemas/ConsoleCoverage" }
        sync: { $ref: "#/components/schemas/ConsoleSyncSummary" }

    ConsoleUser:
      type: object
      required: [user_id, username, status, created_at, active_sessions]
      properties:
        user_id: { type: string }
        username: { type: string }
        status:
          type: string
          enum: [active, disabled]
          description: disabled = 不能登录**客户端**；网站账号不受影响
        created_at: { type: string, format: date-time }
        status_changed_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次禁用/解禁时间；从未改过为 null
        active_sessions:
          type: integer
          description: 当前有效会话数。禁用会当场撤销全部会话，正常情况下此处为 0

    ConsoleUserPage:
      allOf:
        - $ref: "#/components/schemas/Paging"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ConsoleUser" }

    ConsoleUserStatusRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 200
          description: |
            禁用原因，仅写入服务端日志（不进数据库、不回显）。
            要「有据可查」请查日志；需要长期留痕时再补审计表，不在这里临时存一份。

    ConsoleUserDetail:
      type: object
      required: [user_id, username, status, active_sessions, collections]
      properties:
        user_id: { type: string }
        username: { type: string }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time, nullable: true }
        status_changed_at: { type: string, format: date-time, nullable: true }
        active_sessions:
          type: integer
          description: 未撤销且未过期的会话数（与列表同一口径）
        collections: { $ref: "#/components/schemas/ConsoleCollectionStats" }

    ConsoleCollectionStats:
      type: object
      required: [total, want, watching, watched, none]
      properties:
        total: { type: integer }
        want: { type: integer }
        watching: { type: integer }
        watched: { type: integer }
        none:
          type: integer
          description: 已收藏但未设状态的条数（对应 status 为 null）
        last_updated_at: { type: string, format: date-time, nullable: true }

    ConsoleUserCollectionItem:
      type: object
      required: [work_id, title, work_type]
      properties:
        work_id: { type: string }
        title: { type: string }
        work_type: { type: string, enum: [anime, comic, game, novel] }
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
          description: null 表示已收藏但未设状态
        cover_url: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }

    ConsoleUserCollectionPage:
      allOf:
        - $ref: "#/components/schemas/Paging"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ConsoleUserCollectionItem" }

    ConsoleAdminItem:
      type: object
      required: [admin_id, username, status, self]
      properties:
        admin_id: { type: string }
        username: { type: string }
        display_name: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        self:
          type: boolean
          description: 是否当前登录的这位（前端据此禁用「停用自己」按钮）

    ConsoleAdminCreateRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, description: 全局唯一 }
        password: { type: string, minLength: 8, maxLength: 72, description: 只存 BCrypt，不回显 }
        display_name: { type: string, nullable: true, maxLength: 64 }

    ConsoleAdminCreated:
      type: object
      required: [admin_id, username, note]
      properties:
        admin_id: { type: string, description: "`G-` 前缀" }
        username: { type: string }
        display_name: { type: string, nullable: true }
        note:
          type: string
          description: 给操作者的说明（口令不回显、需线下转告）

    ConsoleAdminStatusChange:
      type: object
      required: [admin_id, username, status, revoked_sessions, note]
      properties:
        admin_id: { type: string }
        username: { type: string }
        status: { type: string, enum: [active, disabled] }
        revoked_sessions: { type: integer, description: 本次撤销的后台会话数；幂等重试时为 0 }
        note: { type: string }

    ConsolePasswordChangeRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    ConsoleUserStatusChange:
      type: object
      required: [user_id, status, revoked_sessions, note]
      properties:
        user_id: { type: string }
        status: { type: string, enum: [active, disabled] }
        revoked_sessions: { type: integer, description: 本次撤销的会话数（幂等重复调用为 0） }
        note:
          type: string
          description: |
            给站主看的原话，后台必须原样展示。禁用时明确写「网站账号不受影响」——
            这句话只写在文档里是不够的，前端换个实现就会漏掉

    ConsoleSyncRun:
      type: object
      required: [batch_id, run_seq, source, counts, started_at, status]
      properties:
        batch_id: { type: string }
        run_seq: { type: integer, description: 该 batch 的第几次运行，从 1 开始 }
        source: { type: string }
        counts: { $ref: "#/components/schemas/Counts" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true, description: null = 没有收尾 }
        status: { type: string, enum: [ok, partial, failed] }

    ConsoleFailedItem:
      type: object
      required: [batch_id]
      properties:
        batch_id: { type: string }
        source_id: { type: string, nullable: true, description: 来源站作品 id，补齐时按它重跑 }
        code: { type: string, nullable: true }
        message: { type: string, nullable: true }
        run_at: { type: string, format: date-time, nullable: true }

    ConsoleSyncStatus:
      type: object
      required: [site, sources, summary, recent_runs, failed_items, retry_hint]
      properties:
        site: { $ref: "#/components/schemas/ConsoleSite" }
        sources:
          type: array
          items: { type: string }
        summary: { $ref: "#/components/schemas/ConsoleSyncSummary" }
        recent_runs:
          type: array
          description: 最近 20 次运行，按时间倒序
          items: { $ref: "#/components/schemas/ConsoleSyncRun" }
        failed_items:
          type: array
          description: 最近几次运行里的拒收条目（最多 50 条），供运维按 source_id 补齐
          items: { $ref: "#/components/schemas/ConsoleFailedItem" }
        retry_hint:
          type: string
          description: 补齐方式说明（含具体命令）。后台不提供触发同步的按钮，理由见接口描述

    SiteCreateRequest:
      type: object
      required: [site_key, display_name, sources]
      properties:
        site_key: { type: string, maxLength: 32 }
        display_name: { type: string, maxLength: 128 }
        sources:
          type: array
          minItems: 1
          description: 本站的数据来源标识（与 work.source 同值）。一个来源只能属于一个站点
          items: { type: string, maxLength: 64 }

    SiteAdminCreateRequest:
      type: object
      required: [site_key, username, password]
      properties:
        site_key: { type: string, description: 必须已存在 }
        username: { type: string, maxLength: 64, description: 全局唯一，站主登录时不需要先选站点 }
        password: { type: string, description: 8–72 字符；服务端只存 BCrypt }
        display_name: { type: string, nullable: true, maxLength: 64 }

    SiteAdminCreated:
      type: object
      required: [admin_id, site_key, username]
      properties:
        admin_id: { type: string, description: "`G-` 前缀" }
        site_key: { type: string }
        username: { type: string }
        display_name: { type: string, nullable: true }

    SiteStatusChange:
      type: object
      required: [site_key, status, revoked_admin_sessions, note]
      properties:
        site_key: { type: string }
        status: { type: string, enum: [active, suspended], description: 流转后的状态 }
        revoked_admin_sessions:
          type: integer
          description: 本次撤销的站主后台会话数；幂等重试时为 0
        note:
          type: string
          description: 给平台运营看的说明（含"会话已撤销、数据保留"等事实）

    SiteAdminStatusChange:
      type: object
      required: [admin_id, site_key, username, status, revoked_sessions, note]
      properties:
        admin_id: { type: string, description: "`G-` 前缀" }
        site_key: { type: string }
        username: { type: string }
        status: { type: string, enum: [active, disabled], description: 流转后的状态 }
        revoked_sessions:
          type: integer
          description: 本次撤销的该站主后台会话数；幂等重试时为 0
        note:
          type: string
          description: 给平台运营看的说明（含"站点本身不受影响"等事实）
    DeviceRegistrationRequest:
      type: object
      required: [device_id, platform, provider, token]
      properties:
        device_id:
          type: string
          maxLength: 64
          description: |
            客户端生成的**安装级**标识（重装后变）。不是 token——token 会轮换，
            用它当 upsert 键会在每次轮换时留下一条僵尸记录。
        platform:
          type: string
          enum: [android, windows, ios]
        provider:
          type: string
          enum: [fcm, apns]
          description: 推送服务商。`apns` 仅留位——本仓库没有 iOS 端
        token:
          type: string
          maxLength: 512
          description: |
            provider 下发的令牌。**视同凭据**：服务端不回显、不进日志。
            全局唯一，跨账号转移——别个账号注册同一个 token 时，本账号那条立即失效。
        app_version:
          type: string
          maxLength: 32
          nullable: true
          description: 客户端版本，仅用于排查
        enabled:
          type: boolean
          default: true
          description: 是否启用推送。省略按 `true` 处理

    Device:
      type: object
      description: |
        已登记设备。**不含 `token`**——那是凭据，客户端本来就有，回显只增加泄露面。
      required: [device_id, platform, provider, enabled, created_at, updated_at]
      properties:
        device_id:
          type: string
        platform:
          type: string
          enum: [android, windows, ios]
        provider:
          type: string
          enum: [fcm, apns]
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
