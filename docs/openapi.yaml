openapi: 3.0.3

info:
  title: Otaku Data Platform · 第一阶段接口契约
  version: 1.0.0-draft
  description: |
    本文件是《第一阶段最小契约》（docs/stage1-minimal-contract.md）的机器可读版本，
    只覆盖第一阶段四个接口中的 HTTP 部分：

    - **② 数据写入接口** `POST /internal/import/batches`（Python → Java）
    - **③ 作品列表接口** `GET /api/works`（Flutter → Java）
    - **④ 作品详情接口** `GET /api/works/{work_id}`（Flutter → Java）

    **接口①「网站接入」不在本文件。** 那是平台**只读拉取**来源站，来源站的接口不由我们定义，
    接入规范（拿什么、不拿什么、网站需具备什么能力）见契约第 4 节。

    **第一阶段不包含账号、收藏、观看状态接口**，相关路径在第二阶段另行定义。
    本文件只描述请求与响应的**形状**；字段语义、可空规则、创建与更新规则以契约正文为准。

    三条边界：
    1. 数据单向流动：网站 → 平台 → 客户端，平台不回写网站。
    2. 只有 Java 写业务数据库；Python 只经接口②提交。
    3. 空值一律 `null`，不用 `""`、`0`、"暂无" 之类的伪值填充。
  contact:
    name: 契约讨论
    url: https://github.com/zhengmin486/otaku-data-platform/issues/3

servers:
  - url: http://localhost:8080
    description: Java 后端（本地联调占位地址，由 Java 负责人确认后替换）

tags:
  - name: 内部导入
    description: 仅供 Python 同步作业调用，客户端不得持有内部令牌
  - name: 作品查询
    description: Flutter 手机端与桌面端共用的公开读接口

security: []

paths:

  /api/works:
    get:
      tags: [作品查询]
      summary: 作品列表与关键词搜索（接口③）
      operationId: listWorks
      description: |
        分页返回作品列表。**列表不返回 `summary`**——来源简介最长 7225 字，会把列表响应撑爆。

        边界约定：
        - 无匹配时返回 `200` + `items: []` + `total: 0`，不是 404。
        - `page` 超出 `total_pages` 时返回 `200` + 空数组。
        - `page_size` 超过 50 时**按 50 截断**，不报错。
        - 排序规则由 Java 决定，但必须**稳定**（同一查询多次返回顺序一致）。
      parameters:
        - name: type
          in: query
          description: 作品类型过滤，省略表示全部类型
          schema:
            type: string
            enum: [anime, comic, game, novel]
        - name: q
          in: query
          description: |
            标题关键词，子串匹配、忽略大小写。不支持别名与拼音
            （别名来源未出口，第一阶段做不到）。省略表示不过滤。
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 单页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paging"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WorkSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}:
    get:
      tags: [作品查询]
      summary: 作品详情（接口④）
      operationId: getWork
      description: |
        按 `work_id` 取全部 10 个字段。

        `work_id` 一律当作**不透明字符串**：不解析其结构，不做数值比较。
        不存在与格式非法**都返回 404**，不用错误码区分"是否存在"。
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 成功，直接返回作品对象（不再套一层 data）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/batches:
    post:
      tags: [内部导入]
      summary: 提交一个同步批次（接口②）
      operationId: submitImportBatch
      description: |
        Python 同步作业专用，不对外暴露。

        幂等：同一个 `batch_id` 重复提交返回首次结果，不重复入库。
        单批上限 500 条，超出返回 `413 BATCH_TOO_LARGE`，Python 需自行拆批。

        创建与更新规则：
        - `(source, source_id)` 未命中 → 创建；必填项缺失则整条 rejected。
        - 命中 → 只覆盖本次**出现且非 `null`** 的字段；`null` 表示本次没数据，不覆盖。
        - `tags: []` 表示明确无标签，会清空；`tags: null` 不清空。
        - `work_id` 首次创建时生成，此后不因内容变更而改变。
        - 来源侧消失的作品**不删除**。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportBatchRequest" }
      responses:
        "200":
          description: 批次处理完成，逐条结果见 counts 与 errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/batches/{batch_id}:
    get:
      tags: [内部导入]
      summary: 查询批次结果（重跑前核对用）
      operationId: getImportBatch
      security:
        - internalToken: []
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:

  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 内部服务令牌。仅同步作业持有，客户端与前端**不得**持有该密钥。

  parameters:
    WorkId:
      name: work_id
      in: path
      required: true
      description: 平台内部标识，由 Java 生成，客户端只当不透明字符串使用
      schema: { type: string }

  responses:
    BadRequest:
      description: 请求格式或参数不合法（不重试，修正后重发）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 内部令牌缺失或无效（不重试）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 作品或批次不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BatchTooLarge:
      description: 单批条数超过 500（Python 拆批后重发）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 限流（重试，带退避）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 服务端错误（重试，带退避）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:

    Paging:
      type: object
      required: [page, page_size, total, total_pages, items]
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total:
          type: integer
          description: 符合条件的总数。客户端靠它判断是否末页，必须返回
          example: 7894
        total_pages: { type: integer, example: 395 }
        items:
          type: array
          items: {}

    SourceRating:
      type: object
      nullable: true
      description: |
        来源评分。`null` 表示来源没有评分，**不是 0 分**，客户端必须不显示评分区域，
        不得显示 `0.0`。
      required: [value, scale, source]
      properties:
        value:
          type: number
          example: 7.8
        scale:
          type: string
          enum: ["0-10"]
          description: 评分尺度。当前来源为 0-10，是否原样入库待团队确认
        source:
          type: string
          example: otaku_site

    WorkSummary:
      type: object
      description: |
        列表项。**6 个字段，不含 `summary`**——简介最长 7225 字，列表带上会把响应撑爆，
        客户端需要简介时按 `work_id` 拉详情。
      required: [work_id, work_type, title]
      properties:
        work_id: { type: string, example: "W-8f3a91" }
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title: { type: string, example: 街角魔族 2丁目 }
        cover_url:
          type: string
          nullable: true
          description: |
            平台后端代理 + 本地缓存地址（Java 首次回源后缓存，之后由平台服务；客户端不直连来源站）。
            `null` 表示无封面，客户端显示占位图。
          example: https://api.example.com/covers/W-8f3a91
        tags:
          type: array
          nullable: true
          description: |
            `null` = 来源未提供；`[]` = 明确无标签（客户端不渲染标签区）。
            来源侧每条最多 5 个（站方截断），不宜作为主要筛选维度。
          items: { type: string }
          example: ["日常", "搞笑"]
        main_rating: { $ref: "#/components/schemas/SourceRating" }

    Work:
      type: object
      description: 详情。**全部 10 个字段。**
      required: [work_id, work_type, title, source, source_id, updated_at]
      properties:
        work_id:
          type: string
          description: 平台内部标识，不透明，客户端所有业务只认它
          example: "W-8f3a91"
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title: { type: string, example: 街角魔族 2丁目 }
        summary:
          type: string
          nullable: true
          description: |
            换行已统一为 `\n`，**不截断**（最长 7225 字），折叠由客户端处理。
            `null` 表示来源没有简介，客户端显示"暂无简介"。
        cover_url: { type: string, nullable: true, description: 平台后端代理+缓存地址（同列表项）；null 表示无封面 }
        tags:
          type: array
          nullable: true
          items: { type: string }
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        source:
          type: string
          description: 接入方唯一标识。第一阶段只有 otaku_site
          example: otaku_site
        source_id:
          type: string
          description: |
            来源站内作品 ID，字符串存储。可返回给客户端做溯源展示，
            但**客户端不得用它做业务判断**（跨站可能重复）。
          example: "476"
        updated_at:
          type: string
          format: date-time
          description: 该记录最后一次变更时间，由 Java 维护，RFC 3339

    ImportBatchRequest:
      type: object
      required: [batch_id, source, items]
      properties:
        batch_id:
          type: string
          maxLength: 128
          description: |
            幂等键，格式 `{source}-{类型}-{日期}-{内容指纹}`，
            指纹为排序后 source_id 集合的哈希。同一批输入重跑必须得到同一个 batch_id。
          example: otaku_site-anime-20261020-3a9f1c
        source:
          type: string
          enum: [otaku_site]
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 本次拉取时间，仅作排查参考，不参与业务判断
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ImportItem" }

    ImportItem:
      type: object
      description: |
        提交项 7 个字段。`work_id` 由 Java 生成、`updated_at` 由 Java 维护、`source` 在批次级，
        因此都不出现在条目里。
      required: [source_id, work_type, title]
      properties:
        source_id:
          type: string
          minLength: 1
          description: 来源站作品 ID。与批次级 source 共同构成唯一键
          example: "476"
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: 来源标题原文，不做跨类型转换、不做截断
        summary:
          type: string
          nullable: true
          description: 换行已统一为 \n；来源缺失传 null，不传空字符串
        cover_url:
          type: string
          nullable: true
          description: 已拼成绝对地址；空串在 Python 侧已转为 null
        tags:
          type: array
          nullable: true
          description: |
            `null` = 本次没拿到（不覆盖已有值）；`[]` = 明确无标签（清空）。
            两者语义不同，不要混用。
          items: { type: string }
        main_rating: { $ref: "#/components/schemas/SourceRating" }

    ImportBatchResult:
      type: object
      required: [batch_id, counts, errors]
      properties:
        batch_id: { type: string }
        counts:
          type: object
          required: [inserted, updated, unchanged, rejected]
          properties:
            inserted: { type: integer, example: 97 }
            updated: { type: integer, example: 3 }
            unchanged: { type: integer, example: 0 }
            rejected: { type: integer, example: 0 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        errors:
          type: array
          description: 只需失败明细与提示项，成功条目不必逐条回传
          items: { $ref: "#/components/schemas/ImportItemResult" }

    ImportItemResult:
      type: object
      required: [source_id, result]
      properties:
        source_id: { type: string }
        result:
          type: string
          enum: [inserted, updated, unchanged, rejected]
        work_id:
          type: string
          nullable: true
          description: rejected 时为 null
        code:
          type: string
          nullable: true
          description: |
            逐条错误码，走本数组而不走统一错误信封——一条坏记录不该拖垮整批。
            `DUPLICATE_IN_BATCH` 只是提示（同批内 source_id 重复，最后一次生效），不算失败。
          enum:
            - TITLE_REQUIRED
            - INVALID_TYPE
            - RATING_OUT_OF_SCALE
            - DUPLICATE_IN_BATCH
            - INTERNAL_ERROR
        message:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      description: 统一错误信封，接口②③④共用（接口①是平台主动拉取，失败记适配器日志）
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - BAD_REQUEST
                - WORK_NOT_FOUND
                - BATCH_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
              description: 面向开发者的说明，不直接展示给终端用户
      example:
        error: { code: WORK_NOT_FOUND, message: 作品不存在 }
