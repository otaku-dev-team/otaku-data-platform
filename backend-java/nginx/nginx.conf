# 生产用 Nginx 主配置。挂到容器 /etc/nginx/nginx.conf:ro。
#
# 为什么不用官方镜像自带的 nginx.conf：自带的那份没有 gzip、没有 server_tokens off，
# 而这两项必须写在 http{} 里，没法从 conf.d/ 下的 server 块补。
#
# server 块在 templates/default.conf.template（走官方镜像的 envsubst 机制，
# DOMAIN 等值从 .env 注入，见 README）。

user  nginx;
# auto = 按 CPU 核数起 worker。2 核机器就是 2 个，别手动调大。
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # rt=$request_time 是排查慢请求的关键：后端 P99 与 Nginx 侧耗时的差，
    # 就是反代链路（含客户端）的成本，没有这个字段会分不清是谁慢。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 不把版本号写进响应头和错误页——少一条指纹信息。
    server_tokens   off;

    # 读接口没有请求体；给 2m 是留给以后可能的上传，别放大到几十兆。
    client_max_body_size 2m;

    # 列表接口返回 JSON，57 万条的分页响应压缩后能小一个量级。
    # gzip_proxied any 是必须的：默认只压缩「客户端没带 Via」的响应，
    # 而 Nginx 自己就是反代，不写 any 会出现「本地 curl 有压缩、线上没有」。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        application/json
                      application/javascript
                      application/xml
                      text/css
                      text/plain
                      text/xml
                      image/svg+xml;

    # ── 限流（默认不启用，见 README §5）────────────────────────────────
    # 为什么要留在这里而不是删掉：Nginx 的 limit_req_zone 只能定义在 http{}，
    # 所以 server 块里要开限流，必须先有这两个 zone。
    # 默认注释掉 = 不启用；启用后命中会返回 429（limit_req_status），
    # 而 429 不在 openapi 的错误码表里 → 属契约外状态码，需与客户端一起确认（Issue #188）。
    #
    # limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # limit_req_zone $binary_remote_addr zone=covers:10m rate=5r/s;

    include /etc/nginx/conf.d/*.conf;
}
