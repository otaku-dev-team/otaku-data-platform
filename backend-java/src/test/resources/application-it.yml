# 集成测试专用 profile：连真实 MySQL（不是内存库），跑完自己清理数据。
#
# 为什么单独建库：并发/快照语义只有真 MySQL 能验证，H2 与内存实现都替代不了；
# 又不想碰开发库 otaku，所以固定连 otaku_it。
#
# 默认值面向本机 docker compose 的容器库（3307）。
# Git Bash / PowerShell：
#   IT_DB_PORT=3307 ./mvnw test
# CI 里由 workflow 注入 IT_DB_PORT=3306 指向 service 容器。

spring:
  datasource:
    url: jdbc:mysql://${IT_DB_HOST:127.0.0.1}:${IT_DB_PORT:3307}/${IT_DB_NAME:otaku_it}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${IT_DB_USER:otaku}
    password: ${IT_DB_PASSWORD:otaku123}

app:
  # 集成测试直接调 service，不经过 HTTP，给个占位值即可（为空时 /internal/** 一律 401）。
  internal-token: it-token
  # 限流在集成测试里默认关闭：几十个用例共用 127.0.0.1，开着会把彼此打红。
  # 限流本身由 RateLimitIntegrationTest 用独立上下文 + 极小额度验证。
  rate-limit:
    enabled: false
  work:
    site-scope:
      # 「只显示首站收录」在集成测试里关掉：测试库没有 site_scope 清单，
      # 开着会让所有「导入后能查到」的用例凭空变空。规则本身由
      # WorkSiteScopeIntegrationTest（properties 里单独打开）+ 生产验证覆盖。
      enabled: false
  import:
    # 「来源必须登记到站点」的校验在集成测试里关掉：所有用例共用一个库，
    # 别的测试类建的站点会残留下来，开着会让导入用例因为「有站但来源没登记」而红。
    # 这条规则本身由 ImportSourceRegistryTest（单测）与 2026-10-31 的第二站演练覆盖。
    require-registered-source: false
  cover:
    # 放 target 下，避免在仓库里留运行产物
    cache-dir: target/it-covers

  profile:
    # 头像文件也放 target 下，测试结束由用例自己清理
    avatar-dir: target/it-avatars
    # 集成测试会连续上传多张，关掉 1 分钟 1 次的限制（限流本身由单测覆盖）
    avatar-upload-interval-seconds: 0

  site-oauth:
    # 集成测试固定用首站标识；核心代码里不出现该常量（单站隔离校验）
    identity-source: otaku_site
