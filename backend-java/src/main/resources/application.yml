server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: backend-java
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:otaku}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    # 契约通篇 snake_case：work_id / page_size / main_rating / batch_id …
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  # 内部导入令牌。为空时 /internal/** 一律 401（安全默认），联调前必须设置。
  internal-token: ${OTAKU_INTERNAL_TOKEN:}
  # 留空则按请求 host 推导，便于 Android 模拟器(10.0.2.2)/桌面(127.0.0.1)/真机(局域网 IP) 共用一套代码。
  public-base-url: ${OTAKU_PUBLIC_BASE_URL:}
  cors:
    # 允许跨域读 /api/** 的来源（逗号分隔，origin 形式，如 http://154.8.194.198:8000）。
    # **留空 = 只放行本地调试来源**（localhost / 127.0.0.1 / ::1 任意端口）。
    # 这是 Issue #188 的收窄：原先 allowedOriginPatterns("*") 会回显任意 Origin，
    # 任何页面都能把封面代理当图床。新增合作站时把它的 origin 加进来，不要改回 "*"。
    allowed-origins: ${OTAKU_CORS_ALLOWED_ORIGINS:}
    allow-localhost: ${OTAKU_CORS_ALLOW_LOCALHOST:true}
  site-oauth:
    # 站点 OAuth 令牌交换代理（Issue #242，契约 identity-linkup-contract.md §2 / §7）。
    # base-url 或 client-secret **任一为空 = 站点登录未配置**，POST /api/auth/site-login 返回 503（fail-closed）。
    # client_secret 只从环境变量注入：绝不入库、不落日志、不回显、不进任何仓库文件与文档。
    base-url: ${OTAKU_SITE_OAUTH_BASE_URL:}
    client-id: ${OTAKU_SITE_OAUTH_CLIENT_ID:otaku-app-client}
    client-secret: ${OTAKU_SITE_OAUTH_CLIENT_SECRET:}
    # 写入 app_user.identity_source 的来源标识。**不给默认值**：站名是部署事实，
    # 写死等于把首站焊进核心代码（单站隔离校验会拦）。留空 = 站点登录未配置 → 503。
    identity-source: ${OTAKU_SITE_OAUTH_IDENTITY_SOURCE:}
    timeout: 10s
    # 站点令牌有效期（站点侧固定 3600 秒），只用于记录 site_token_expires_at。
    token-ttl: 3600s
  rate-limit:
    # 公共读接口按 IP 限流（Issue #188 形态 A）。关闭只用于排障，生产不要关：
    # 现在没有站点身份，按 IP 是唯一能挡住"脚本刷图床"的手段。
    enabled: ${OTAKU_RATE_LIMIT_ENABLED:true}
    # 作品/标签/档期/资讯等公共读：每分钟每 IP
    public-per-minute: ${OTAKU_RATE_LIMIT_PUBLIC_PER_MINUTE:600}
    # 封面更严：它会回源并缓存，被当图床的代价是带宽 + 回源
    cover-per-minute: ${OTAKU_RATE_LIMIT_COVER_PER_MINUTE:240}
    # 上 Nginx / 反代之后必须打开，否则所有请求都会算到反代 IP 上（限流退化成全局限流）
    trust-forwarded-for: ${OTAKU_TRUST_FORWARDED_FOR:false}
  cover:
    cache-dir: ${OTAKU_COVER_CACHE_DIR:./data/covers}
    rate-per-second: 2
    max-concurrency: 2
    timeout: 10s
    max-bytes: 5242880
    # 封面回源白名单（host:port）。**留空 = 全部拒绝**（fail-closed），不是"不限"。
    # 接新的来源站时，把它的 host:port 加到 OTAKU_COVER_ALLOWED_HOSTS 即可，不需要改代码。
    # 默认只含首站自身：保证不写 .env 时行为与旧版一致（首站封面仍可用）。
    # 逗号分隔的字符串会被 Spring 自动拆成 List<String>；接 Bangumi 镜像需加 bgmimg.anibt.net:443。
    allowed-hosts: ${OTAKU_COVER_ALLOWED_HOSTS:154.8.194.198:8000}
    # 封面防盗链：允许**跨域引用**封面的来源页（origin 形式，如 http://example.com:8080）。
    # **留空 = 不限制**（历史行为）。开启后：不带 Referer 的请求（Flutter 客户端 / curl / 服务端）
    # 仍然放行，只有「浏览器带着别站页面地址来取图」才拒（返回 404，契约里既有的码）。
    # 开启前先确认 Flutter Web 的调试端口，否则 Web 端封面会被拦。
    allowed-referers: []
  ugc:
    retention:
      # 软删（作者撤回）的评论保留天数，到期物理删除。见 docs/ugc-retention-proposal.md：
      # 保留是为了追溯，但「保留」不等于「永久」——用户以为删了，数据不该一直躺着。
      # 开发期按 zm 定的 15 天（方便测清理链路）；上线前按站点/法务口径改。
      # 0 = 不清理（站点给出「全留」口径时用；此时删除只能人工执行）。
      deleted-days: ${OTAKU_UGC_RETENTION_DELETED_DAYS:15}
      # 用户注销时是否移除他的评论。默认 false = 匿名化保留（作者显示「已注销用户」，楼层不塌）；
      # 打开 = 软删，对外立即消失，物理清理由上面的保留天数兜底。
      remove-comments-on-account-removal: ${OTAKU_UGC_REMOVE_ON_ACCOUNT_DELETION:false}

management:
  endpoints:
    web:
      exposure:
        # metrics / prometheus 只对持有内部令牌的调用方开放（见 InternalTokenFilter）：
        # 8080 是公网可达的，把 QPS 与错误率裸奔出去没必要。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        # Boot 3.5 起指标导出默认关（management.defaults.metrics.export.enabled=false），
        # 不显式打开就只有端点空壳、没有 prometheus 这个 endpoint。
        enabled: true
  metrics:
    tags:
      # 多实例时用来区分来源；现在只有一个实例，但标签一开始就带上，将来加实例不用改看板。
      application: ${spring.application.name:backend-java}
    distribution:
      percentiles-histogram:
        # 只有直方图才能算 p95/p99。平均延迟会掩盖长尾，而长尾才是用户感知到的「卡」。
        http.server.requests: true

logging:
  level:
    root: INFO
    com.otaku: DEBUG
