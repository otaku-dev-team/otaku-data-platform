# 本地开发 profile：配合 backend-java/compose.yaml 起的 MySQL 容器。
#
#   docker compose up -d
#   $env:SPRING_PROFILES_ACTIVE="local"   # PowerShell
#   .\mvnw.cmd spring-boot:run
#
# 这里的口令与令牌只用于本机联调，**不要**在任何共享或线上环境激活这个 profile。

spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${DB_NAME:otaku}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:otaku}
    password: ${DB_PASSWORD:otaku123}

app:
  # 与 Python 侧 OTAKU_INTERNAL_TOKEN 保持一致即可
  internal-token: ${OTAKU_INTERNAL_TOKEN:dev-token}
